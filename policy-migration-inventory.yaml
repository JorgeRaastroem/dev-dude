  # ---------------------------------------------------------------- stage-workflow.md
  - id: STG-FW-001
    title: Epistemic firewall
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [all stages]}
    rules:
      - {id: STG-FW-001.R01, statement: "Every functional-skill invocation is a named bounded stage; root owns transitions and applies lifecycle; root is the dedicated controller."}
      - {id: STG-FW-001.R02, statement: "Stage may use only: versioned workflow; validated input handoff; contract-authorized artifacts/tools; root-supplied shared policies/contract definitions; tool results retrieved and verified during the stage."}
      - {id: STG-FW-001.R03, statement: "Prior conversation, hidden reasoning, scratchpads, tool chatter, unreferenced artifacts are untrusted; absent item -> open question, authorized retrieval, or blocker; never reconstruct from memory."}
    defaults: {}
    exceptions: []
    consumers: [all stages]
    sources:
      - {bundle: both, path: references/stage-workflow.md, section: "# Epistemic Stage Workflow / ## Epistemic Firewall", lines: "1-19"}
    destination: {file: policies/stage-workflow.yaml, key: firewall}
  - id: STG-DECL-001
    title: Stage declaration and amendment authority
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator]}
    rules:
      - {id: STG-DECL-001.R01, statement: "Before dispatch root records stable stage name, bounded objective, required contract fields, authorized artifacts/tools, expected durable outputs, completion criteria, permitted next stage/terminal."}
      - {id: STG-DECL-001.R02, statement: "Only the workflow definition and explicit versioned amendments may change objective, scope, constraints, transitions; a handoff cannot amend its workflow."}
    defaults: {}
    exceptions: []
    consumers: [orchestrator]
    sources:
      - {bundle: both, path: references/stage-workflow.md, section: "## Stage Declaration", lines: "21-32"}
    destination: {file: policies/stage-workflow.yaml, key: declaration}
  - id: STG-LIFE-001
    title: Stage lifecycle (8 steps)
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [all stages, orchestrator]}
    rules:
      - {id: STG-LIFE-001.R01, step: 1, statement: "Initialize fresh context with only declaration, validated contract, authorized artifacts, shared policies, tool capabilities."}
      - {id: STG-LIFE-001.R02, step: 2, statement: "Validate input per validation rules; resolve artifacts/evidence; do not execute on failure."}
      - {id: STG-LIFE-001.R03, step: 3, statement: "Restate bounded objective and measurable completion criteria before work."}
      - {id: STG-LIFE-001.R04, step: 4, statement: "Execute in scope with per-invocation controlled/cooperative monitoring; bounded waits when supported; checkpoint; partial/blocked returns; keep epistemic types distinct."}
      - {id: STG-LIFE-001.R05, step: 5, statement: "Verify every criterion; re-check material claims; reverify inherited facts before high-impact/irreversible actions."}
      - {id: STG-LIFE-001.R06, step: 6, statement: "Serialize next YAML contract per schema; conclusions + evidence only."}
      - {id: STG-LIFE-001.R07, step: 7, statement: "Root runs contract gate; next stage only after pass."}
      - {id: STG-LIFE-001.R08, step: 8, statement: "Discard working context; validated contract + authorized artifacts are the only durable output."}
    defaults: {}
    exceptions: []
    consumers: [all stages, orchestrator]
    sources:
      - {bundle: both, path: references/stage-workflow.md, section: "## Lifecycle", lines: "34-55"}
    destination: {file: policies/stage-workflow.yaml, key: lifecycle}
  - id: STG-STORE-001
    title: Transition storage layout
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, stages]}
    rules:
      - {id: STG-STORE-001.R01, statement: "Contracts stored beside run state under .dev-dude-handoffs/ named NNN-<from>-to-<to>.yaml (e.g. 000-root-to-first-stage.yaml)."}
      - {id: STG-STORE-001.R02, statement: "Monotonically increasing sequence; stable stage names; run state indexes but does not replace contracts; final outputs traceable via evidence locators."}
    defaults: {first_contract: 000-root-to-first-stage.yaml}
    exceptions: []
    consumers: [orchestrator, stages]
    sources:
      - {bundle: both, path: references/stage-workflow.md, section: "## Transition Storage", lines: "57-71"}
    destination: {file: policies/stage-workflow.yaml, key: storage}
  - id: STG-FAIL-001
    title: Stage failure and recovery handling
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [all stages, orchestrator]}
    rules:
      - {id: STG-FAIL-001.R01, case: invalid_input, statement: "Do not start; return validation issues with remediation."}
      - {id: STG-FAIL-001.R02, case: missing_information, statement: "Open question; retrieve only when authorized; else block."}
      - {id: STG-FAIL-001.R03, case: contradictory_evidence, statement: "Preserve both claims/evidence; route to allowed resolution stage or blocked."}
      - {id: STG-FAIL-001.R04, case: partial_completion, statement: "partial + unmet criteria + continuation; redispatch same stage only after quiescence, reconciliation, repeat-safety and budget check; never advance."}
      - {id: STG-FAIL-001.R05, case: deadline_exceeded, statement: "Record threshold separately; never infer cancellation; unknown pauses recovery; no retry/replacement/overlap while active; missing cancellation needs no approval."}
      - {id: STG-FAIL-001.R06, case: tool_or_artifact_failure, statement: "Record dependency, error category, attempted action, safe retry/escalation; never invent results."}
      - {id: STG-FAIL-001.R07, case: changed_artifact, statement: "Digest mismatch requires revalidation; intentional evolution = new artifact ID and digest."}
      - {id: STG-FAIL-001.R08, case: workflow_conflict, statement: "Workflow wins unless authorized versioned amendment."}
      - {id: STG-FAIL-001.R09, case: blocked_or_failed, statement: "Checkpoint status; route only as workflow permits."}
      - {id: STG-FAIL-001.R10, case: user_gate, statement: "Return blocked handoff with blocking question, options, same-stage continuation; root validates, records waiting-for-user, asks without deadline; on explicit decision checkpoints evidence, new validated same-stage contract, re-dispatch from first incomplete step; unresolved keeps gate open; never infer approval."}
    defaults: {}
    exceptions: []
    consumers: [all stages, orchestrator]
    sources:
      - {bundle: both, path: references/stage-workflow.md, section: "## Failure and Recovery", lines: "73-99"}
    destination: {file: policies/stage-workflow.yaml, key: failure_handling}

  # ---------------------------------------------------------------- handoff-contract-schema.md
  - id: HOC-SCHEMA-001
    title: Handoff contract YAML schema
    kind: schema
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, stages]}
    rules:
      - {id: HOC-SCHEMA-001.R01, statement: "Every stage boundary uses a YAML contract; preserve identifiers for same item; new identifier when meaning changes; empty typed lists explicit []."}
      - {id: HOC-SCHEMA-001.R02, section: handoff, fields: [schema_version "1.0", workflow_id, workflow_version, run_id, contract_id, producing_stage, receiving_stage, status complete|partial|blocked|failed]}
      - {id: HOC-SCHEMA-001.R03, section: objective, fields: [statement, "completion_criteria[id CCnnn, statement, status met|unmet|not_applicable, evidence]"]}
      - {id: HOC-SCHEMA-001.R04, section: verified_facts, fields: ["id Fnnn", statement, "evidence[artifact_id, locator]", "verification_status verified"]}
      - {id: HOC-SCHEMA-001.R05, section: assumptions, fields: ["id Annn", statement, reason, "verification_status unverified|partially_verified", impact_if_false]}
      - {id: HOC-SCHEMA-001.R06, section: constraints, fields: ["id Cnnn", statement, source]}
      - {id: HOC-SCHEMA-001.R07, section: decisions, fields: ["id Dnnn", statement, rationale, based_on]}
      - {id: HOC-SCHEMA-001.R08, section: rejected_approaches, fields: ["id Rnnn", approach, reason, based_on]}
      - {id: HOC-SCHEMA-001.R09, section: artifacts, fields: ["id ARTnnn", uri_or_path, media_type, "digest (optional algorithm:value)", purpose, "access required|optional"]}
      - {id: HOC-SCHEMA-001.R10, section: open_questions, fields: ["id Qnnn", question, owner_stage, blocking]}
      - {id: HOC-SCHEMA-001.R11, section: blockers, fields: ["id Bnnn", description, required_resolution]}
      - {id: HOC-SCHEMA-001.R12, section: failures, fields: ["id Xnnn", dependency, category, action_attempted, retry_or_escalation]}
      - {id: HOC-SCHEMA-001.R13, section: continuation, fields: [remaining_criteria, next_action]}
      - {id: HOC-SCHEMA-001.R14, section: next_stage, fields: [objective, required_inputs, authorized_artifacts, authorized_tools, "prohibited_dependencies (defaults: prior conversation history; unreferenced artifacts; unverified assumptions treated as facts)"]}
      - {id: HOC-SCHEMA-001.R15, section: validation, fields: ["result pending|pass|fail", validated_by, "issues[code, location, message, remediation]"]}
    defaults: {schema_version: "1.0"}
    exceptions: []
    consumers: [orchestrator, stages, VAL-* rules]
    sources:
      - {bundle: both, path: references/handoff-contract-schema.md, section: "# Handoff Contract Schema (yaml block)", lines: "1-105"}
    destination: {file: policies/handoff-schema.yaml, key: schema}
  - id: HOC-SEM-001
    title: Handoff required semantics
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, stages]}
    rules:
      - {id: HOC-SEM-001.R01, statement: "All top-level sections required; empty lists/null where permitted; producer sets validation.result pending; only root gate sets pass/fail; receiver accepts only pass."}
      - {id: HOC-SEM-001.R02, statement: "Nonterminal requires receiving_stage, bounded next_stage.objective, authorized tools/artifacts; terminal sets null/empty."}
      - {id: HOC-SEM-001.R03, statement: "complete requires all applicable criteria met, no blocking question, blocker, unresolved failure."}
      - {id: HOC-SEM-001.R04, statement: "partial needs unmet criteria + precise continuation; blocked needs blocker or blocking question; failed needs recorded failure; none authorizes a different next stage."}
      - {id: HOC-SEM-001.R05, statement: "Every verified fact needs resolvable evidence; confidence wording is not evidence."}
      - {id: HOC-SEM-001.R06, statement: "Assumptions stay assumptions until new evidence supports a separately recorded fact."}
      - {id: HOC-SEM-001.R07, statement: "Decisions/rejections reference declared facts/constraints in based_on."}
      - {id: HOC-SEM-001.R08, statement: "Artifact authorization is least-access for stated purpose; present digest must match before use."}
      - {id: HOC-SEM-001.R09, statement: "Contradictions recorded as blocking open questions with both claims until resolved."}
      - {id: HOC-SEM-001.R10, statement: "Never serialize chain-of-thought, scratchpads, tool chatter, transcripts."}
      - {id: HOC-SEM-001.R11, statement: "Cooperative limitations in constraints; unknown execution status in blockers (resolution: completion or verified termination); reference journal/runtime evidence; handoff status != invocation termination; never encode elapsed deadline/cancel request as verified cancellation."}
      - {id: HOC-SEM-001.R12, statement: "Root creates initial contract from normalized command and verified runtime state; stage writes all sections with pending validation; root records final outcome after independent validation."}
    defaults: {}
    exceptions: []
    consumers: [orchestrator, stages]
    sources:
      - {bundle: both, path: references/handoff-contract-schema.md, section: "## Required Semantics", lines: "107-135"}
    destination: {file: policies/handoff-schema.yaml, key: semantics}

  # ---------------------------------------------------------------- validation-rules.md
  - id: VAL-PASS-001
    title: Contract validation passes
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator]}
    rules:
      - {id: VAL-PASS-001.R01, statement: "Root validates every input/output contract independently of producer assertions; four passes."}
      - {id: VAL-PASS-001.R02, pass: structural, statement: "YAML parses; all sections; schema 1.0; valid enums; stable workflow/run identity; unique ids and contract id; all references resolve; receiving-stage fields required for nonterminal, prohibited for terminal; receiving stage/objective permitted by workflow version."}
      - {id: VAL-PASS-001.R03, pass: evidence, statement: ">=1 specific resolvable locator per verified fact and met criterion; artifacts exist/accessible/declared; recompute digests; downgrade unsupported claims or fail; elapsed deadline/cancel request/missing artifact/stale journal not termination evidence -> UNVERIFIED_TERMINATION."}
      - {id: VAL-PASS-001.R04, pass: epistemic, statement: "Types separate; decisions/rejections reference support; conflicts as blocking questions; reject confidence-as-evidence and unsupported promotion; reject transcripts/CoT/scratchpads/tool chatter/irrelevant context."}
      - {id: VAL-PASS-001.R05, pass: workflow, statement: "Producer stayed in scope and evaluated all criteria; complete cannot have unmet criteria/blockers/blocking questions/unresolved failures; partial/blocked/failed cannot advance; downstream inputs present; least-context authorization; workflow prevails unless authorized amendment; user approval has durable evidence; quiescence before recovery/advancement (EXECUTION_NOT_QUIESCENT); unknown pauses recovery; missing cancellation does not block initial dispatch."}
    defaults: {validated_by: root-contract-gate}
    exceptions: []
    consumers: [orchestrator]
    sources:
      - {bundle: both, path: references/validation-rules.md, section: "# Handoff Validation Rules .. ## Workflow Pass", lines: "1-51"}
    destination: {file: policies/validation-rules.yaml, key: passes}
  - id: VAL-OUT-001
    title: Validation outcome recording and issue codes
    kind: schema
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator]}
    rules:
      - {id: VAL-OUT-001.R01, statement: "Record pass (issues []) or fail with issues; example MISSING_EVIDENCE at verified_facts[F003]."}
      - {id: VAL-OUT-001.R02, statement: "Each issue requires stable code, exact field location, message, actionable remediation."}
      - {id: VAL-OUT-001.R03, statement: "No dispatch on failure; return issues to producer or stop at gate when user action needed."}
      - {id: VAL-OUT-001.R04, key: issue_codes, value: [MISSING_EVIDENCE, DIGEST_MISMATCH, SCOPE_VIOLATION, INCOMPLETE_STAGE, EXCESS_CONTEXT, WORKFLOW_CONFLICT, UNVERIFIED_TERMINATION, EXECUTION_NOT_QUIESCENT]}
    defaults: {}
    exceptions: []
    consumers: [orchestrator, stages]
    sources:
      - {bundle: both, path: references/validation-rules.md, section: "## Outcome", lines: "53-77"}
    destination: {file: policies/validation-rules.yaml, key: outcome}
  - id: VAL-ADV-001
    title: Adversarial check matrix and independent replay
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, workflow maintainers]}
    rules:
      - {id: VAL-ADV-001.R01, statement: "Use matrix to evaluate stage-workflow changes and suspicious handoffs."}
      - {id: VAL-ADV-001.R02, scenario: "verified claim no evidence", result: "MISSING_EVIDENCE or reclassify"}
      - {id: VAL-ADV-001.R03, scenario: "later stage promotes assumption", result: "preserve type; verify or block"}
      - {id: VAL-ADV-001.R04, scenario: "info only in chat", result: "unavailable"}
      - {id: VAL-ADV-001.R05, scenario: "digested artifact changed", result: "DIGEST_MISMATCH; revalidate"}
      - {id: VAL-ADV-001.R06, scenario: "contradictory claims", result: "record both; block or route"}
      - {id: VAL-ADV-001.R07, scenario: "stage does later-stage work", result: SCOPE_VIOLATION}
      - {id: VAL-ADV-001.R08, scenario: "unmet criterion but complete", result: INCOMPLETE_STAGE}
      - {id: VAL-ADV-001.R09, scenario: "transcript/raw reasoning", result: EXCESS_CONTEXT}
      - {id: VAL-ADV-001.R10, scenario: "handoff conflicts with workflow", result: "WORKFLOW_CONFLICT; workflow wins"}
      - {id: VAL-ADV-001.R11, scenario: "fresh agent with allowed inputs", result: "can restate objective, knowledge, limits"}
      - {id: VAL-ADV-001.R12, scenario: "no cancellation/enforced timeout, valid input, no active work", result: "cooperative dispatch; record limitations; no capability-only gate"}
      - {id: VAL-ADV-001.R13, scenario: "verified background polls + cancellation or enforced timeout", result: "controlled mode; checks, deadlines, termination verification, three-retry limit"}
      - {id: VAL-ADV-001.R14, scenario: "cancellation advertised but invocation sync/unpollable without timeout", result: "cooperative; record limitation; no capability-only gate"}
      - {id: VAL-ADV-001.R15, scenario: "background polls but no cancellation/timeout", result: "cooperative; retain polls; wrapper alone not control"}
      - {id: VAL-ADV-001.R16, scenario: "cooperative active after deadline", result: "deadline exceeded; active; monitor; no cancel claim/retry"}
      - {id: VAL-ADV-001.R17, scenario: "sync cooperative prevents live checks", result: "record before launch; reconcile on return; no interruption/bounded-return promise"}
      - {id: VAL-ADV-001.R18, scenario: "stopped/cancelled claimed without evidence", result: UNVERIFIED_TERMINATION}
      - {id: VAL-ADV-001.R19, scenario: "unknown status on resume, missing outputs/stale journal", result: "execution status unknown + recovery-paused; no reset/duplicate"}
      - {id: VAL-ADV-001.R20, scenario: "parent returned, descendant active/unknown", result: EXECUTION_NOT_QUIESCENT}
      - {id: VAL-ADV-001.R21, scenario: "user approves retry while work may be active", result: "recovery stays paused"}
      - {id: VAL-ADV-001.R22, scenario: "completion confirmed after deadline, criteria met", result: "validate normally, no replay"}
      - {id: VAL-ADV-001.R23, scenario: "verified stopped, partial output", result: "reconcile; retry safe incomplete work under same action ID/budget"}
      - {id: VAL-ADV-001.R24, scenario: "three retries exhausted or unsafe repeat", result: "bounded-unresolved or safety gate; never reset/infer approval"}
      - {id: VAL-ADV-001.R25, statement: "Independent replay: receiver can initialize and explain permitted knowledge from workflow, contract, authorized artifacts, current tool results only."}
    defaults: {}
    exceptions: []
    consumers: [orchestrator, maintainers, policy audit (as test vectors)]
    sources:
      - {bundle: both, path: references/validation-rules.md, section: "## Adversarial Checks", lines: "79-110"}
    destination: {file: policies/validation-rules.yaml, key: adversarial_matrix}

