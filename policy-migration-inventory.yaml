  - id: INV-GLOBAL-001
    title: Global invariants
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, all stages]}
    rules:
      - {id: INV-GLOBAL-001.R01, statement: "Root owns all phase transitions and gate status."}
      - {id: INV-GLOBAL-001.R02, statement: "A stage relies only on its workflow, validated handoff, authorized artifacts/tools, independently retrieved evidence; missing info is unknown/blocking, never recovered from chat."}
      - {id: INV-GLOBAL-001.R03, statement: "Facts, assumptions, constraints, decisions, rejected approaches, open questions, blockers, failures, artifacts stay distinct; never silently promote an assumption."}
      - {id: INV-GLOBAL-001.R04, statement: "No transition until contract passes structural, evidence, epistemic, workflow validation; amendments explicit and versioned."}
      - {id: INV-GLOBAL-001.R05, statement: "Contracts carry evidence-backed outcomes; no chain-of-thought, scratchpads, tool chatter, raw exploration, irrelevant history."}
      - {id: INV-GLOBAL-001.R06, statement: "Never infer user approval; pause at every gate until explicit decision recorded."}
      - {id: INV-GLOBAL-001.R07, statement: "Max concurrent Code-Flow-Analyzers: 6.", key: concurrency.code_flow_analyzer, value: 6}
      - {id: INV-GLOBAL-001.R08, statement: "Max concurrent Feature-Implementers: 3.", key: concurrency.feature_implementer, value: 3}
      - {id: INV-GLOBAL-001.R09, statement: "Every investigation-documenter task that changes files has explicit write permission."}
      - {id: INV-GLOBAL-001.R10, statement: "Every Feature-Implementer result has a corresponding Test-Implementer result before validation."}
      - {id: INV-GLOBAL-001.R11, statement: "Root owns bounded validation attempt counter and all remediation re-dispatch."}
      - {id: INV-GLOBAL-001.R12, statement: "Feature work finishes only on validator SATISFIED or recorded bounded-unresolved state."}
      - {id: INV-GLOBAL-001.R13, statement: "Discover and run available build, test, lint, type-check commands before feature completion."}
      - {id: INV-GLOBAL-001.R14, statement: "Remove .tmp/ artifacts after consuming block finishes; preserve normal outputs and .dev-dude-run-state.md."}
      - {id: INV-GLOBAL-001.R15, platform: claude, statement: "Shut down all team agents and delete the team after final state is recorded."}
    defaults: {concurrency: {code_flow_analyzer: 6, feature_implementer: 3}}
    exceptions: []
    consumers: [dev-dude-orchestrator, all functional skills]
    sources:
