validation_tooling:
  existing:
    - id: TOOL-CI-001
      path: ".github/workflows/bump-agent-versions.yml"
      trigger: "push touching Copilot/dev-dude/agents/*.md or Claude skill/dev-dude/agents/*.md (lines 3-7)"
      guard: "skips github-actions[bot] and commits containing [skip agent-version-bump] (line 14)"
      behavior:
        - "computes max semver across all 18 agent frontmatter `version:` lines, bumps patch (lines 79-88)"
        - "rewrites every agent `version:` and inserts one if absent before closing frontmatter (lines 90-101)"
        - "rewrites `Bundled agent crew version: `x.y.z`` in both root SKILL.md files (lines 103-110)"
        - "commits and pushes as github-actions[bot] (lines 112-124)"
      migration_impact: >-
        Regex consumers of agent `version:` frontmatter and the root SKILL.md crew-version sentence.
        If crew versions move to YAML, this workflow must also bump the YAML key (or derive the
        SKILL.md sentence from YAML) in the same commit. Must not be broken silently.
      checks_performed: "none beyond version bump; no lint, schema, parity, or coverage validation"
  absent:
    - "no test suite, package manifest, linter, YAML schema validation, Markdown lint, link check, or Mermaid check in repo"
    - "no cross-platform parity check for shared references/functional skills"
    - "no check that root crew-version sentence matches agent/skill frontmatter (only the bump workflow writes it)"
    - "no check of update-path invariants (names, nine agents, four skills) against bundle contents"
  runtime_validation_described_in_policy:
    - "handoff contract validation gate (references/validation-rules.md) - performed by agents at runtime, not CI"
    - "Mermaid validation by investigation-documenter (mmdc or parser fallback)"
    - "update staging validation of names/versions (SKILL.md Handle the Standalone update Command step 4)"

implementation_architecture:
  status: proposed-pending-approval
  principles:
    - "Each platform bundle stays self-contained (installed independently); YAML lives inside each bundle."
    - "Shared policy YAML files are byte-identical across bundles; platform differences live only in platform.yaml and models.yaml overlays."
    - "Functional-skill workflow YAML lives inside each functional skill directory because those skills install as separate sibling directories."
    - "Runtime-parsed frontmatter (name, description, version, model, tools, color) must remain in .md files; YAML is the source of truth and the audit enforces equality."
    - "Stable policy/rule IDs from this inventory become YAML ids; every inventory entry maps to exactly one destination key."
    - "Markdown bodies shrink to loader stubs that name the YAML files to load (no new Markdown files)."
  destination_layout:
    per_bundle:
      - {file: "policies/manifest.yaml", purpose: "index: schema version, file list, policy-id -> file/key map, load order, precedence"}
      - {file: "policies/metadata.yaml", purpose: "root/crew versions, names, descriptions, argument hints, crew membership"}
      - {file: "policies/platform.yaml", purpose: "platform bindings: agent names, delegation tool, install paths, tool names (only per-platform file besides models.yaml)"}
      - {file: "policies/models.yaml", purpose: "per-agent model defaults (current values preserved), model command config, override precedence"}
      - {file: "policies/commands.yaml", purpose: "argument parsing, routes, usage text, slug, input types, host-only commands (update, models)"}
      - {file: "policies/update.yaml", purpose: "launch update check and update command"}
      - {file: "policies/install.yaml", purpose: "agent/skill crew install, version comparison, gates, Mermaid prerequisite"}
      - {file: "policies/runtime-context.yaml", purpose: "indexer/research context, capability gates"}
      - {file: "policies/bootstrap.yaml", purpose: "host->controller transfer, bootstrap packet, relay rules"}
      - {file: "policies/orchestration.yaml", purpose: "controller entry, state recovery entry points, dispatch table, global invariants, stable outputs"}
      - {file: "policies/state.yaml", purpose: "run-state schema, statuses, checkpoint and reconciliation rules"}
      - {file: "policies/watchdog.yaml", purpose: "execution modes, deadlines, retries, journals, single-writer"}
      - {file: "policies/envelope.yaml", purpose: "orchestration envelope fields and specialist rules"}
      - {file: "policies/stage-workflow.yaml", purpose: "epistemic firewall, lifecycle, storage, failure handling"}
      - {file: "policies/handoff-schema.yaml", purpose: "handoff contract schema + semantics"}
      - {file: "policies/validation-rules.yaml", purpose: "four validation passes, issue codes, adversarial matrix"}
      - {file: "policies/trusted-sources.yaml", purpose: "citation-host invariant, allow/prohibit lists, degradation"}
      - {file: "policies/output-templates.yaml", purpose: "document/report templates as structured sections + verbatim template bodies"}
      - {file: "policies/agents/<agent>.yaml", purpose: "one per crew agent: role, boundaries, permissions, tools, responsibilities, outputs, checklists, examples"}
    per_functional_skill:
      - {file: "skills/<skill>/references/workflow.yaml", purpose: "steps, phases, gates, entry/exit contracts, concurrency"}
      - {file: "skills/<skill>/SKILL.md", purpose: "frontmatter + loader stub (kept Markdown; runtime requirement)"}
    repository_level:
      - {file: "scripts/policy_audit.py", purpose: "completeness/parity/frontmatter/coverage audit run manually with python3; no new dependencies (fails closed with remediation if a YAML parser is unavailable)"}
      - {file: "(none) no new CI workflow/runner", purpose: "existing automation is only .github/workflows/bump-agent-versions.yml; audit is not wired into a new runner"}
      - {file: "policy-migration-inventory.yaml", purpose: "this file; audit input mapping every ID to destination key"}
  agent_body_strategy:
    decision_required: true
    options:
      - id: ABS-A
        summary: "Agent .md body is rendered deterministically from policies/agents/<agent>.yaml; audit fails on drift"
        pros: "agents stay self-contained when installed as single files under ~/.copilot/agents or .claude/agents; standalone use preserved"
        cons: "rendered prose persists (generated); needs renderer"
      - id: ABS-B
        summary: "Agent .md body becomes a loader stub; envelope passes absolute agent-policy YAML path"
        pros: "no duplicated prose"
        cons: "agents unusable outside DevDude envelope; requires envelope field change (ENV) and bootstrap path passing"
    recommendation: ABS-A
  completeness_audit_design:
    checks:
      - "every inventory policy and rule id exists exactly once in its destination YAML key"
      - "every non-blank line of every in-scope baseline file is covered by >=1 inventory source range (coverage block)"
      - "shared YAML files byte-identical across bundles; platform.yaml/models.yaml have identical key sets"
      - "frontmatter in .md (name, version, model, tools, color, description) equals metadata/models/agents YAML"
      - "root crew-version values equal every agent/skill version; nine agents and four skills present"
      - "no status: pending left after migration; planned changes and conflicts each have a recorded resolution"
      - "rendered agent bodies (if ABS-A) match committed .md bodies"
      - "YAML parses; ids unique; cross-references (based_on, mirrors, supersedes) resolve"
  migration_order:
    - "1 schema+manifest+platform/models/metadata YAML"
    - "2 shared references -> YAML (identical across bundles)"
    - "3 root SKILL.md -> commands/update/install/runtime-context/bootstrap/orchestration YAML"
    - "4 functional skills -> workflow.yaml"
    - "5 agents -> policies/agents/*.yaml (+ render or stub)"
    - "6 planned changes: models.yaml + /dev-dude models command"
    - "7 README + bump workflow update; manual audit script (no new runner); set statuses migrated/verified"
  version_impact: "root version bump in both bundles; skill crew bump (workflow changes); agent crew bump (agent changes, via bump workflow)"

policies:
  # ---------------------------------------------------------------- root metadata
  - id: META-ROOT-001
    title: Root skill frontmatter identity
    kind: metadata
    status: pending
    scope: {platforms: [claude, copilot], actors: [runtime-loader, host, update-check]}
    rules:
      - {id: META-ROOT-001.R01, key: name, value: dev-dude}
      - {id: META-ROOT-001.R02, key: version, value: "1.0.1", note: "user-facing semantic release version; compared numerically by update check"}
      - {id: META-ROOT-001.R03, key: description, value_claude: "...using agent swarms...", value_copilot: "...using agent fleets...", note: "otherwise identical 5-line folded description listing arch/where, feature/write, update"}
    defaults: {}
    exceptions: []
    consumers: [Claude/Copilot skill loader, UPD-CHECK-001, UPD-CMD-001 step 4/5, README Release versions]
    sources:
      - {bundle: both, path: SKILL.md, section: frontmatter, lines: "1-10"}
    destination: {file: policies/metadata.yaml, key: root}
    platform_variants: {description_word: {claude: swarms, copilot: fleets}}
    notes: "Frontmatter must stay in SKILL.md for runtime discovery; YAML is source of truth, audit enforces equality."
  - id: META-ROOT-002
    title: Root argument hints
    kind: metadata
    status: pending
    scope: {platforms: [claude, copilot], actors: [runtime-loader, user]}
    rules:
      - {id: META-ROOT-002.R01, statement: "Hints: update; DudeWhereIsMyArch all; all refresh; authentication refresh; DudeWhereIsMyArch authentication; DudeWriteMyFeature Add user caching"}
    defaults: {}
    exceptions: []
    consumers: [runtime command palette (if parsed), users]
    sources:
      - {bundle: both, path: SKILL.md, section: "argument-hint (after frontmatter)", lines: "11-17"}
    destination: {file: policies/metadata.yaml, key: root.argument_hints}
    notes: "argument-hint is placed AFTER the closing frontmatter delimiter (line 10), so runtimes do not parse it as frontmatter. See CNF-ROOT-001."
  - id: META-ROOT-003
    title: Root skill authority statement
    kind: role
    status: pending
    scope: {platforms: [claude, copilot], actors: [host, orchestrator]}
    rules:
      - {id: META-ROOT-003.R01, statement: "Root skill defines setup, routing, durable state, user gates, functional workflow transitions."}
      - {id: META-ROOT-003.R02, statement: "Dedicated orchestrator agent executes orchestration; host only bootstraps and relays user decisions; neither performs specialist work."}
      - {id: META-ROOT-003.R03, statement: "Agent definitions supply orchestration expertise; skill + references supply workflow authority."}
      - {id: META-ROOT-003.R04, statement: "A general-purpose agent must never substitute for the dedicated controller."}
    defaults: {}
    exceptions: []
    consumers: [host, dev-dude-orchestrator]
    sources:
      - {bundle: both, path: SKILL.md, section: "# DevDude Root Orchestrator", lines: "19-25"}
    destination: {file: policies/orchestration.yaml, key: authority}
    platform_variants: {orchestrator_name: {claude: dev-dude-orchestrator, copilot: dev-dude-orchestrator-copilot}}
  - id: META-CREW-001
    title: Bundled agent crew version and membership
    kind: metadata
    status: pending
    scope: {platforms: [claude, copilot], actors: [host, update, TOOL-CI-001]}
    rules:
      - {id: META-CREW-001.R01, key: agent_crew_version, value: "1.0.6", note: "sentence `Bundled agent crew version: `1.0.6`` is regex-maintained by TOOL-CI-001"}
      - {id: META-CREW-001.R02, key: agents, value: [dev-dude-orchestrator, code-flow-analyzer, ux-design-reviewer, architecture-reviewer, technical-resource-investigator, investigation-documenter, feature-implementer, test-implementer, feature-validator], note: "copilot names add -copilot suffix"}
      - {id: META-CREW-001.R03, statement: "Claude lists them as required Task subagent_type values; Copilot as required custom agent types."}
    defaults: {}
    exceptions: []
    consumers: [INST-AGT-001, UPD-CMD-001, TOOL-CI-001, README]
    sources:
      - {bundle: both, path: SKILL.md, section: "### Install and Verify the Agent Crew", lines: "108-122"}
    destination: {file: policies/metadata.yaml, key: crews.agents}
  - id: META-CREW-002
    title: Bundled functional skill crew version and membership
    kind: metadata
    status: pending
