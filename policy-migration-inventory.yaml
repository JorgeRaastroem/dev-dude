    - "Line coverage: every non-blank line of every in-scope bundle file falls inside >=1 policy source range (per bundle; `both` counts for both). Computed by scripts/policy_audit.py --inventory."
    - "ID coverage: every policy/rule ID appears exactly once in its destination YAML; every destination file key resolves."
    - "Parity: shared YAML byte-identical across bundles except platform.yaml/models.yaml; platform-scoped rules only in the bundle they apply to."
    - "Frontmatter audit: agent/skill/root frontmatter equals metadata.yaml/models.yaml values."
    - "Conflicts and planned changes: each CNF/PCH must reach a recorded resolution before status migrated."
    - "No silent retirement: a rule can leave the inventory only via status superseded-by-planned-change with a PCH reference."
    - "Limits: line/ID/count coverage proves structural completeness only, NOT semantic equivalence. Semantic fidelity is certified by an independent model completeness audit requested by the parent (rule-by-rule comparison of baseline prose vs migrated YAML); the implementer does not self-certify."
