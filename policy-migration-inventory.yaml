      - {id: PCH-MOD-008.R02, capability: exact_model_id_validation, claude: unknown, copilot: unknown}
      - {id: PCH-MOD-008.R03, capability: hot_reload_agent_frontmatter, claude: unknown, copilot: unknown, note: "treat as requiring restart"}
      - {id: PCH-MOD-008.R04, rule: "unknown is handled exactly like unsupported for overrides (fail closed with remediation); static defaults keep working."}
