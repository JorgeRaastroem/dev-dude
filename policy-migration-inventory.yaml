    destination: {file: policies/metadata.yaml, key: crews.skills}
  - id: META-SKL-001
    title: Functional skill frontmatter (4 skills)
    kind: metadata
    status: pending
    scope: {platforms: [claude, copilot], actors: [runtime-loader, INST-SKL-001]}
