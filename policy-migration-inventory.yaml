    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, functional skills, agents]}
    rules:
      - {id: WD-JOURNAL-001.R01, statement: "Only root writes .dev-dude-run-state.md incl. task/gate transitions and consolidated watchdog table."}
      - {id: WD-JOURNAL-001.R02, statement: "Root assigns stage invocation ID and journal <run-output>/.dev-dude-watchdog/<invocation-id>.md; stage is sole writer; never edits run state."}
      - {id: WD-JOURNAL-001.R03, statement: "Stage records own status/last update and each child action's parent ID, invocation ID, mode/capabilities, start/deadline, retry count, last check, execution status, outcome, evidence."}
      - {id: WD-JOURNAL-001.R04, statement: "Root reads journal at each check/return and copies reconciled facts; missing/stale/conflicting journal data cannot prove a child stopped."}
      - {id: WD-JOURNAL-001.R05, statement: "Delegated agents report to stage owner and never edit either file; 'checkpoint' inside a functional workflow means write the stage journal."}
      - {id: WD-JOURNAL-001.R06, statement: "Preserve journals until referenced invocations quiescent and indexed; restarted stage reads prior journals + run state before choosing retry count; new invocation ID never resets retry budget."}
