# ==================================================================== planned changes (approved, distinct)
planned_changes:
  - id: PCH-MOD-001
    title: Authoritative model configuration in policies/models.yaml
    kind: planned-change
    status: pending
    behavior_change: false
    description: >-
      Move per-agent default models into policies/models.yaml per bundle, preserving every current
      value exactly (claude: orchestrator/AR/UX/CFA/FI/TI/FV opus, TRI/ID haiku; copilot: orchestrator
      gpt-6.1-sol, AR/UX claude-opus-5, CFA/FV gpt-5.6-sol, TRI/ID gpt-5.6-luna, FI claude-opus-4.8,
      TI gpt-5.6-terra). Agent frontmatter `model:` stays (host loaders read it) and is audited for equality.
    affects: [AGT-ORC-META-001, AGT-AR-META-001, AGT-UX-META-001, AGT-CFA-META-001, AGT-TRI-META-001, AGT-ID-META-001, AGT-FI-META-001, AGT-TI-META-001, AGT-FV-META-001]
    destination: {file: policies/models.yaml, key: defaults}
  - id: PCH-MOD-002
    title: "/dev-dude models command family"
    kind: planned-change
    status: pending
    behavior_change: true
    description: >-
      New host-only subcommands (proposed: `models` / `models show [agent]`, `models set <agent> <model>`,
      `models reset [agent|all]`, `models validate`). Today an exact first token `models` falls through
      to usage/feature input; `DudeWhereIsMyArch models refresh` must keep meaning the vertical named
      "models" (routing is by first token only). Host-only: never dispatches the orchestrator.
      Instruction-driven maintenance performed by the host agent following policies/models.yaml, NOT an
      executable CLI/script; adds no dependencies and no new runner.
    rules:
      - {id: PCH-MOD-002.R01, rule: "Commands are host instructions (read/validate/write YAML config, report status); no script, binary, package or new CI runner."}
      - {id: PCH-MOD-002.R02, rule: "`models show` reports per agent: static default, configured override (+ source file), runtime capability state, loaded/effective model, and whether a restart/host config is pending."}
      - {id: PCH-MOD-002.R03, rule: "`models set` validates exact model-ID syntax and capability state before writing; when per-dispatch override is unsupported/unknown it records nothing as effective and returns blocked with remediation."}
      - {id: PCH-MOD-002.R04, rule: "`models reset` removes overrides only; never edits bundled or globally installed agent files."}
    affects: [CMD-ROUTE-001, CMD-USAGE-001, CMD-INPUT-001]
    decisions_needed: [final subcommand names, whether `models` without args lists or prints help]
    destination: {file: policies/commands.yaml, key: models}
  - id: PCH-MOD-003
    title: User model overrides persisted outside owned files
    kind: planned-change
    status: pending
    behavior_change: true
    description: >-
      Store overrides in user-owned config files that `update` never replaces and that
      installation-hash customization detection excludes. Proposed layers: user profile
      <runtime-skill-dir>/dev-dude/.dev-dude-models.local.yaml and optional project profile
      <repo>/.dev-dude/models.yaml. Overrides are dispatch-time configuration only.
    rules:
      - {id: PCH-MOD-003.R01, rule: "Precedence: project profile > user profile > static default from models.yaml (agent frontmatter)."}
      - {id: PCH-MOD-003.R02, rule: "Project profiles MUST NOT rewrite shared/global installed agent files (~/.claude/agents, ~/.copilot/agents); they only affect dispatch-time overrides."}
      - {id: PCH-MOD-003.R03, rule: "Override values are exact model IDs; aliases/fuzzy matching are rejected."}
    decisions_needed: [override file locations, whether project profiles are supported in v1]
    affects: [UPD-CMD-001, INST-LOCK-001, INST-AGT-001]
    destination: {file: policies/models.yaml, key: overrides}
  - id: PCH-MOD-004
    title: Effective model resolution at dispatch
    kind: planned-change
    status: pending
    behavior_change: true
    description: >-
      Effective model = configured override, applied only through a documented runtime per-dispatch
      model parameter; otherwise the static frontmatter default remains effective. Runtime docs could
      not be verified in this environment (Claude sub-agents docs unreachable; GitHub custom-agents URL
      404), so capability support is recorded as `unknown` per platform and fails closed. Copilot today
      passes the frontmatter model alias per task call (INST-RT-001.R02, ARCH-PRE-001.R05,
      FVAL-GATE-001.R02, FIMP-IMPL-001.R05, FDES-*); that default behaviour is preserved.
    rules:
      - {id: PCH-MOD-004.R01, rule: "Static defaults stay in agent frontmatter and models.yaml and are never changed by overrides."}
      - {id: PCH-MOD-004.R02, rule: "Per-platform capability `dispatch_model_override` in platform.yaml: supported | unsupported | unknown, with documentation citation; baseline value unknown for both platforms."}
      - {id: PCH-MOD-004.R03, rule: "Override is applied only when capability is supported (documented); prefer runtime per-dispatch parameter over any file rewrite."}
      - {id: PCH-MOD-004.R04, rule: "unknown/unsupported + override configured -> blocked before dispatch with remediation: change host/runtime agent configuration, then restart the host session; or remove the override. Never silently fall back to the default."}
      - {id: PCH-MOD-004.R05, rule: "Never rewrite installed shared agent frontmatter to emulate an override (replaces the earlier Claude rewrite proposal)."}
      - {id: PCH-MOD-004.R06, rule: "Report configured vs loaded vs effective model separately; loaded = what the host session actually loaded (frontmatter at session start); mismatch requires restart and is reported, not hidden."}
      - {id: PCH-MOD-004.R07, rule: "Record the effective model and its source (default|user|project) in the envelope/run state for audit."}
    affects: [INST-RT-001, ARCH-PRE-001, FDES-INV-001, FDES-RES-001, FDES-OPT-001, FDES-CRIT-001, FIMP-IMPL-001, FIMP-TEST-001, FVAL-GATE-001, ENV-001, BOOT-PKT-001]
    destination: {file: policies/models.yaml, key: resolution}
  - id: PCH-MOD-005
    title: Model validation gate and explicit critique-pass model
    kind: planned-change
    status: pending
    behavior_change: true
    description: >-
      Unknown/unavailable model -> blocked gate with remediation (no silent fallback). The TRI
      critique-and-amend "stronger model" becomes explicit key models.yaml:roles.tri_critique; until
      decided, behavior stays "stronger than TRI default, chosen by stage". Note claude-opus-5 and
      claude-opus-4.8 are not verified available in this environment. Validation checks exact-ID syntax
      and capability state only; it does not claim a model is available unless the runtime confirms it.
    affects: [FDES-RES-001, AGT-TRI-002, AGT-AR-META-001, AGT-UX-META-001, AGT-FI-META-001]
    destination: {file: policies/models.yaml, key: validation}
  - id: PCH-MOD-006
    title: Crew versioning and bump workflow interaction
    kind: planned-change
    status: pending
    behavior_change: true
    description: >-
      Adding policies/*.yaml changes shipped bundle content: bump root version in both bundles;
      model default edits count as agent-crew changes (bump agent versions via TOOL-CI-001).
      Workflow regexes rely on agent `version:` lines and the sentence "Bundled agent crew version:" -
      keep that sentence or update the workflow in the same change.
    rules:
      - {id: PCH-MOD-006.R01, rule: "Root SKILL.md keeps the literal line 'Bundled agent crew version: `x.y.z`' and every agent .md keeps a frontmatter `version:` line; metadata.yaml versions are derived copies audited for equality, never the workflow's write target."}
      - {id: PCH-MOD-006.R02, rule: "If metadata.yaml must hold the crew version, either the audit checks equality after the workflow runs, or the workflow is narrowly extended to also rewrite that one YAML key; no other workflow change."}
      - {id: PCH-MOD-006.R03, rule: "models.yaml defaults mirror agent frontmatter `model:`; the bump workflow must not need to touch models.yaml."}
    affects: [META-ROOT-001, META-CREW-001, TOOL-CI-001]
  - id: PCH-UPD-001
    title: Offline model-maintenance exception to the launch update check
    kind: planned-change
    status: pending
    behavior_change: true
    description: >-
      `/dev-dude models ...` is local, offline configuration maintenance: it skips the launch-time
      network update check (UPD-CHECK-001), crew install, indexer onboarding, Mermaid setup and dispatch.
      README line 73 ("Every launch checks ...") must be reworded to name this exception, and
      UPD-CHECK-001 scope `when` changes from "every host launch" to "every host launch except
      `update` (own pinned check) and `models` (offline)".
    rules:
      - {id: PCH-UPD-001.R01, rule: "models commands make no network requests and never print update-available notices."}
      - {id: PCH-UPD-001.R02, rule: "README update-check paragraph and UPD-CHECK-001 scope are updated together; audit checks README mentions the exception."}
    affects: [UPD-CHECK-001, PCH-MOD-002, README-CMDS]
    destination: {file: policies/update.yaml, key: launch_check.exceptions}
  - id: PCH-MOD-008
    title: Runtime capability registry and documentation evidence
    kind: planned-change
    status: pending
    behavior_change: true
    description: >-
      platform.yaml records runtime capabilities that model configuration depends on, each with state
