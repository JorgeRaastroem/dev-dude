    source_locators_by_bundle: {both: 72, claude: 68, copilot: 69}
    destination_files: 41
    planned_changes: 9
    conflicts: 25
    readme_mirrors: 9
    validation_tooling: 1
    bundle_files: {claude: 24, copilot: 25}
  scope_rules:
    in_scope:
      - "Claude skill/dev-dude/** (all 24 files)"
      - "Copilot/dev-dude/** (all 25 files)"
      - "README.md (documentation mirror of policies)"
      - ".github/workflows/bump-agent-versions.yml (existing validation/maintenance tooling; consumer)"
