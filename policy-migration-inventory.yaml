  # ---------------------------------------------------------------- commands / routing
  - id: CMD-ROUTE-001
    title: Command normalization and routing
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, host]}
    rules:
      - {id: CMD-ROUTE-001.R01, statement: "Exact single token `update` is host-only; reaching the controller returns `blocked` for host maintenance."}
      - {id: CMD-ROUTE-001.R02, statement: "Exactly two tokens with second token `refresh` route to Architecture Delta Refresh; first token is scope (`all` or a vertical); multi-token refresh scopes are rejected with usage.", order: 1}
      - {id: CMD-ROUTE-001.R03, statement: "`DudeWhereIsMyArch`|`arch`|`where` route to Architecture Investigation.", order: 2}
      - {id: CMD-ROUTE-001.R04, statement: "`DudeWriteMyFeature`|`feature`|`write` route to Feature Design & Implementation.", order: 3}
      - {id: CMD-ROUTE-001.R05, statement: "Otherwise print usage and stop.", order: 4}
      - {id: CMD-ROUTE-001.R06, statement: "Remaining tokens after the command are the argument (arch: area|all|directory; feature: text|spec path|image paths)."}
      - {id: CMD-ROUTE-001.R07, statement: "`update refresh` remains a refresh scope; `feature update` remains feature input; extra args after standalone `update` are rejected with usage."}
    defaults: {refresh_scope_all_meaning: "refresh every affected vertical and discover new verticals"}
    exceptions: ["`update refresh` is a refresh, not maintenance"]
