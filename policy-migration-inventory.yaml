# DevDude policy migration inventory (machine-readable; inventory phase only - no sources migrated).
inventory:
  schema_version: "1.0"
  kind: devdude-policy-migration-inventory
  phase: inventory
  status: pending-approval
  baseline:
    commit: cb3b42c87b04b70fac45d4b812bf737edf2a0dfc
    parent_commit: 22a3359
    note: >-
      Every source locator below refers to this commit unless an entry overrides `ref`.
      Line ranges are 1-based and inclusive. `.github/agents/` was never accessed.
  bundles:
    claude:
      root: "Claude skill/dev-dude"
      agent_file_pattern: "agents/{agent}.md"
      agent_name_pattern: "{agent}"
      delegation_mechanism: "Task subagent_type"
    copilot:
      root: "Copilot/dev-dude"
      agent_file_pattern: "agents/{agent}-copilot.md"
      agent_name_pattern: "{agent}-copilot"
      delegation_mechanism: "task agent_type + frontmatter model alias"
  conventions:
    source_locator: >-
      sources[] = {bundle: claude|copilot|both, path: bundle-relative path, section: heading path,
      lines: "start-end"}. `both` means identical path and identical line numbers in both bundles.
    ids: >-
      Policy IDs are <DOMAIN>-<AREA>-<NNN>; rule IDs are <policy-id>.R<NN>. IDs are stable and
      must be preserved verbatim as YAML keys/`id` fields in the destination files.
    kinds:
      metadata: runtime-parsed frontmatter or versioned identity data
      policy: normative rule set
      schema: data structure contract
      template: output document/report format
      role: agent persona/role/boundary statement
      guidance: normative working-style rules for an agent
      example: illustrative trigger examples (descriptions) kept as data
      platform-binding: platform-specific tool/name/path binding
      workflow: ordered stage/phase/step procedure
      gate: user-decision or completion gate
      permission: write/approval/authority boundary
      validation: verification procedure with pass/fail criteria
      documentation-mirror: README text that restates policy IDs
      planned-change: approved future behavior change (recorded distinctly, not yet applied)
      conflict: detected inconsistency needing an explicit resolution decision
    status_values: [pending, migrated, verified, superseded-by-planned-change]
    precedence_at_baseline: >-
      Root workflow + shared references (and authorized amendments) override agent-body guidance
      (dev-dude-orchestrator.md Authority and Boundaries, lines 17-18). Conflicts are listed, not
      silently resolved.
