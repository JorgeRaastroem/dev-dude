  - id: STATE-RECON-001
    title: Reconciliation and recovery
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, host]}
    rules:
      - {id: STATE-RECON-001.R01, statement: "On controller entry verify identity/capabilities from packet, reconcile prior invocation + descendant quiescence before claiming sole-writer ownership."}
      - {id: STATE-RECON-001.R02, statement: "Record new controller invocation before dispatching any stage; update at checks and before returning; preserve correlation ID even without runtime IDs."}
      - {id: STATE-RECON-001.R03, statement: "Legacy state without controller field remains resumable; absence never proves quiescence; inspect task records, journals, runtime evidence."}
      - {id: STATE-RECON-001.R04, statement: "Host may read marker/results to prevent duplicate dispatch, never writes; stale active is not a permanent lock; waiting-for-user/complete/bounded-unresolved labels are not termination evidence."}
      - {id: STATE-RECON-001.R05, statement: "Prior active -> monitor without replacement; unknown -> report recovery paused, no second controller; root records recovery-paused when in control."}
      - {id: STATE-RECON-001.R06, statement: "Controller returns include descendant identities and status evidence; parent return alone cannot establish quiescence; quiescence required even after user approval."}
      - {id: STATE-RECON-001.R07, statement: "Procedure on every command entry/stage entry/resume/compaction: (1) read contract + state, (2) inspect outputs/repo changes/approval docs, (3) reconcile each running/complete task (active->monitor; unknown->execution status unknown + recovery-paused; output-backed complete needs evidence; code-changing needs summary + repo changes; stale->pending only after quiescence + partial-output reconciliation; completed evidence may advance stale checkpoint), (4) never roll back/overwrite/repeat valid work for staleness, (5) validate current contract (invalid does not authorize), (6) determine exactly one next transition and update state, (7) only after quiescence initialize fresh stage within persisted retry budget."}
      - {id: STATE-RECON-001.R08, statement: "Filesystem/repo are evidence, state file is index; execution uncertainty alone -> recovery-paused; safety concerns/uncertain side effects/conflicting work/scope changes -> waiting-for-user + gate."}
    defaults: {}
    exceptions: []
    consumers: [orchestrator, host]
    sources:
      - {bundle: both, path: references/orchestration-state.md, section: "## Reconciliation and Recovery", lines: "82-125"}
    destination: {file: policies/state.yaml, key: reconciliation}
  - id: WD-MODE-001
    title: Execution modes (controlled / cooperative)
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, functional skills]}
    rules:
      - {id: WD-MODE-001.R01, statement: "Root monitors functional-skill dispatches; each skill monitors its agents/tools/shell commands; select and record mode per invocation from verified capabilities."}
      - {id: WD-MODE-001.R02, statement: "Controlled: verified background execution with bounded polls + cancellation callable while active, or runtime-enforced timeout returning within check interval; cancellation tool alone insufficient; retain mechanism; cancel/timeout at deadline; verify termination incl. descendants before recovery."}
      - {id: WD-MODE-001.R03, statement: "Cooperative: no usable control verified for this invocation (even if advertised elsewhere); dispatch via supported mechanism incl. synchronous; no approval merely for missing cancellation; record limitation before launch; instruct bounded objective, checkpoints, partial/blocked returns; deadlines are thresholds; no guaranteed interruption or bounded return; prompts cannot interrupt hung sync calls."}
      - {id: WD-MODE-001.R04, statement: "Prefer background + bounded polls when supported; in sync cooperative root may be unable to check; reconcile on return/resume; never promise unavailable cadence."}
      - {id: WD-MODE-001.R05, statement: "User-decision gates are not timed or retried; safety/side-effect/conflict/scope issues still need explicit gate."}
    defaults: {preferred: background-bounded-polls}
    exceptions: []
    consumers: [orchestrator, functional skills]
    sources:
      - {bundle: both, path: references/orchestration-state.md, section: "## Watchdog", lines: "127-152"}
    destination: {file: policies/watchdog.yaml, key: modes}
