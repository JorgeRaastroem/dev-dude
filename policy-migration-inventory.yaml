  - id: WD-DEADLINE-001
    title: Deadlines, checks, termination evidence
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, functional skills]}
    rules:
      - {id: WD-DEADLINE-001.R01, statement: "Root deadline applies to stage invocation; each child has own mode/deadline/retry budget in stage journal."}
      - {id: WD-DEADLINE-001.R02, statement: "Root may request cancellation of a deadline-exceeded stage in controlled mode only after examining its journal; confirm stage + descendants completed/verified stopped before redispatch."}
      - {id: WD-DEADLINE-001.R03, statement: "If any may remain active: no retry, replacement, advancement, overlapping writes (incl. cleanup); unknown pauses recovery not initial dispatch; approval is not termination evidence."}
      - {id: WD-DEADLINE-001.R04, statement: "Stage-requested gate is not a running invocation: blocked handoff, stop, root validates, records waiting-for-user, asks without deadline; next invocation only after explicit decision + new validated same-stage handoff."}
      - {id: WD-DEADLINE-001.R05, statement: "Before each action assign stable action ID (task, step, tool/action) and record start, mode, deadline, invocation ID, retry count in owner's file."}
      - {id: WD-DEADLINE-001.R06, key: check_interval_seconds, value: 60, statement: "Default check interval 60 s."}
      - {id: WD-DEADLINE-001.R07, key: deadline_minutes, value: 10, statement: "Default deadline 10 minutes per attempt; longer needs justified deadline recorded before start; never extend a running attempt; new deadline per retry with same action ID/retry count."}
      - {id: WD-DEADLINE-001.R08, statement: "Where polling supported use bounded waits <= 60 s and check each concurrent action at least every 60 s; otherwise record unavailable live monitoring and reconcile when control returns."}
      - {id: WD-DEADLINE-001.R09, statement: "At each check read run state, journal, validated input handoff; restate objective, completion evidence, permitted transition; reconcile results with outputs/repo; record time and evidence; missing/invalid handoff blocks progress."}
      - {id: WD-DEADLINE-001.R10, statement: "At/after deadline record `deadline exceeded` separately; controlled+active -> request cancellation/enforced timeout then verify; cooperative+active -> keep monitoring, no retry; undeterminable -> `execution status unknown` + recovery-paused; never mark failed/cancelled for elapsed time; `verified stopped`/`completed` need evidence covering descendants; never mark cancelled without verified evidence."}
    defaults: {check_interval_seconds: 60, deadline_minutes: 10, max_poll_wait_seconds: 60}
    exceptions: ["justified longer deadline recorded before start"]
    consumers: [orchestrator, functional skills]
    sources:
      - {bundle: both, path: references/orchestration-state.md, section: "## Single-writer and nested actions (deadlines/checks)", lines: "172-208"}
    destination: {file: policies/watchdog.yaml, key: deadlines}
  - id: WD-RETRY-001
    title: Retry budget and recovery
    kind: policy
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, functional skills]}
    rules:
      - {id: WD-RETRY-001.R01, statement: "Resume recovery only after completion/verified termination of all prior work; reconcile partial outputs and side effects; validate complete result normally even if deadline exceeded."}
      - {id: WD-RETRY-001.R02, key: max_retries_after_initial, value: 3, statement: "Retry only the same incomplete, safe-to-repeat action up to three retries after initial attempt; record each before dispatch."}
      - {id: WD-RETRY-001.R03, statement: "Never replay completed work, non-idempotent side effects, or actions whose prior invocation/descendants may run."}
      - {id: WD-RETRY-001.R04, statement: "Unknown status: stage reports in journal, root pauses recovery; no approval needed solely for missing cancellation."}
      - {id: WD-RETRY-001.R05, statement: "Unsafe repeat (safety, side effects, conflicting work, scope change) -> waiting-for-user gate with evidence; approval never bypasses quiescence."}
      - {id: WD-RETRY-001.R06, statement: "After third failed retry owner records exhaustion; root marks task failed and run bounded-unresolved; no advance to another stage."}
      - {id: WD-RETRY-001.R07, statement: "Watchdog retry budget independent of feature validation attempt counter; reuse persisted count on resume; never reset to evade exhaustion."}
    defaults: {max_retries_after_initial: 3}
    exceptions: []
    consumers: [orchestrator, functional skills]
    sources:
      - {bundle: both, path: references/orchestration-state.md, section: "## Single-writer and nested actions (retries)", lines: "210-225"}
    destination: {file: policies/watchdog.yaml, key: retries}
  - id: ENV-001
    title: Orchestration envelope
    kind: schema
    status: pending
    scope: {platforms: [claude, copilot], actors: [orchestrator, functional skills, agents]}
    rules:
      - {id: ENV-001.R01, statement: "Every stage/specialist prompt contains the envelope before task context; bootstrap packet is separate."}
      - {id: ENV-001.R02, fields: [Run state, Workflow block, Task ID, Execution mode, Monitoring deadline, Progress reporting, In lane, Expected output, Completion evidence, Input handoff, Output handoff, Next owner], heading: "## DevDude Orchestration"}
      - {id: ENV-001.R03, statement: "Include only context blocks authorized by input contract."}
      - {id: ENV-001.R04, statement: "Specialist must not use prior conversation as state, advance workflow, change gate status, or assume another block's work; returns control and typed evidence to invoking stage."}
      - {id: ENV-001.R05, statement: "Stage reconciles child results into journal and returns output handoff for root validation."}
      - {id: ENV-001.R06, statement: "Stay within bounded objective; report partial/blocked with unmet criteria and continuation; report still-active descendants; returned result alone does not prove descendant termination."}
