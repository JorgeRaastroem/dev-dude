name: Bump agent versions

on:
  push:
    paths:
      - 'Copilot/dev-dude/agents/*.md'
      - 'Claude skill/dev-dude/agents/*.md'
      - 'Copilot/dev-dude/policies/agents/*.yaml'
      - 'Claude skill/dev-dude/policies/agents/*.yaml'
      - 'Copilot/dev-dude/policies/models.yaml'
      - 'Claude skill/dev-dude/policies/models.yaml'

permissions:
  contents: write

jobs:
  bump-agent-versions:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip agent-version-bump]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump shared agent version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          BUNDLES = ('Copilot/dev-dude', 'Claude skill/dev-dude')
          # Agent-crew content: agent Markdown, agent role policy YAML and model defaults.
          # Keep in sync with on.push.paths and policies/metadata.yaml version_bump.trigger_paths.
          CREW_PATH_RE = re.compile(
            r'^(?:Copilot|Claude skill)/dev-dude/'
            r'(?:agents/[^/]+\.md|policies/agents/[^/]+\.yaml|policies/models\.yaml)$'
          )
          METADATA_RE = r'(agents:\n\s+version:\s*)\S+'
          CREW_SENTENCE_RE = r"Bundled agent crew version:\s*`[^`]+`"

          def sh(cmd: list[str]) -> str:
            try:
              completed = subprocess.run(
                cmd,
                text=True,
                capture_output=True,
                check=True,
              )
            except subprocess.CalledProcessError as exc:
              raise RuntimeError(
                f"Command failed: {' '.join(cmd)}\nstdout: {exc.stdout}\nstderr: {exc.stderr}"
              ) from exc
            return completed.stdout.strip()

          def is_crew_change(path: str) -> bool:
            return bool(CREW_PATH_RE.match(path))

          def parse_version(value: str) -> tuple[int, int, int]:
            m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', value.strip())
            if not m:
              return (0, 0, 0)
            return (int(m.group(1)), int(m.group(2)), int(m.group(3)))

          def bump_agent_text(text: str, new_version: str, path) -> str:
            if re.search(r'^version:\s*.+$', text, flags=re.M):
              return re.sub(r'^version:\s*.+$', f'version: {new_version}', text, flags=re.M)
            frontmatter_end = text.find('\n---\n', 4)
            if frontmatter_end == -1:
              raise RuntimeError(f'Missing closing frontmatter delimiter (---) in {path}')
            return text[:frontmatter_end] + f'\nversion: {new_version}' + text[frontmatter_end:]

          def bump_skill_text(text: str, new_version: str) -> str:
            return re.sub(CREW_SENTENCE_RE, f"Bundled agent crew version: `{new_version}`", text)

          def bump_metadata_text(text: str, new_version: str, path) -> str:
            text, count = re.subn(METADATA_RE, rf'\g<1>{new_version}', text, count=1)
            if count != 1:
              raise RuntimeError(f'Missing agent crew metadata version in {path}')
            return text

          def main() -> None:
            before = os.environ.get('BEFORE_SHA')
            after = os.environ.get('AFTER_SHA')

            if before and before != '0000000000000000000000000000000000000000':
              diff = sh(['git', 'diff', '--name-only', before, after])
            else:
              diff = sh(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', after])
            changed = {line for line in diff.splitlines() if line}

            touched = sorted(p for p in changed if is_crew_change(p))
            if not touched:
              print('No agent-crew files changed; skipping bump.')
              raise SystemExit(0)
            print('Agent-crew changes: ' + ', '.join(touched))

            repo = Path('.')
            agent_files = [f for b in BUNDLES for f in sorted((repo / b / 'agents').glob('*.md'))]
            skill_files = [repo / b / 'SKILL.md' for b in BUNDLES]
            metadata_files = [repo / b / 'policies/metadata.yaml' for b in BUNDLES]

            current = (0, 0, 0)
            for path in agent_files:
              m = re.search(r'^version:\s*(.+)$', path.read_text(), flags=re.M)
              if m:
                current = max(current, parse_version(m.group(1)))
            new_version = f"{current[0]}.{current[1]}.{current[2] + 1}"

            for path in agent_files:
              path.write_text(bump_agent_text(path.read_text(), new_version, path))
            for path in skill_files:
              path.write_text(bump_skill_text(path.read_text(), new_version))
            for path in metadata_files:
              path.write_text(bump_metadata_text(path.read_text(), new_version, path))

            sh(['git', 'add', *[str(p) for p in agent_files + skill_files + metadata_files]])
            diff_cached = sh(['git', 'diff', '--cached', '--name-only'])
            if not diff_cached:
              print('No version updates were necessary.')
              raise SystemExit(0)

            sh(['git', 'config', 'user.name', 'github-actions[bot]'])
            sh(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'])
            message = f"chore: bump agent crew version to {new_version} [skip agent-version-bump]"
            sh(['git', 'commit', '-m', message])
            sh(['git', 'push'])

            print(f'Bumped all agents to version {new_version}.')

          if __name__ == '__main__':
            main()
          PY
