schema_version: '1.0'
bundle: copilot
domain: metadata
authority: Normative DevDude policy. Rule fields are authoritative; see policies/manifest.yaml loading.precedence.
crews:
  agents:
    version: 1.0.8
    names:
    - dev-dude-orchestrator-copilot
    - architecture-reviewer-copilot
    - ux-design-reviewer-copilot
    - code-flow-analyzer-copilot
    - technical-resource-investigator-copilot
    - investigation-documenter-copilot
    - feature-implementer-copilot
    - test-implementer-copilot
    - feature-validator-copilot
  skills:
    version: 1.1.4
    names:
    - dev-dude-architecture
    - dev-dude-feature-design
    - dev-dude-feature-implementation
    - dev-dude-validation
root:
  name: dev-dude
  version: 1.1.0
  argument_hint_display:
  - '"update" — Update DevDude and reload its skills and agents'
  - '"models show" — Show the resolved model profile and its sources'
  - '"models profiles" — List profiles per scope and which is active'
  - '"models validate" — Validate model configuration files offline'
  - '"models set <role|all> <model-id> --profile <name> --scope <project|user>" — Save an unvalidated
    draft profile entry'
  - '"models use <profile|bundled-default> --scope <project|user>" — Select the active model profile'
  - '"models reset --scope <project|user>" — Remove this runtime''s model configuration in a scope'
  - '"DudeWhereIsMyArch all" — Full architecture investigation'
  - '"all refresh" — Refresh affected architecture docs'
  - '"authentication refresh" — Refresh one architecture vertical'
  - '"DudeWhereIsMyArch authentication" — Investigate one area'
  - '"DudeWriteMyFeature Add user caching" — Design and implement a feature'
version_bump:
  tool: TOOL-CI-001 (.github/workflows/bump-agent-versions.yml)
  trigger_paths:
  - Copilot/dev-dude/agents/*.md
  - Claude skill/dev-dude/agents/*.md
  - Copilot/dev-dude/policies/agents/*.yaml
  - Claude skill/dev-dude/policies/agents/*.yaml
  - Copilot/dev-dude/policies/models.yaml
  - Claude skill/dev-dude/policies/models.yaml
  reason: Agent role policy (policies/agents/*.yaml) and model defaults (policies/models.yaml) are agent-crew
    content since agent bodies became loaders, so changing them bumps the shared agent crew version (PCH-MOD-006).
  filter: The workflow bumps only when a changed path in the push matches trigger_paths (same globs; `*`
    does not cross `/`).
  writes:
  - every agent frontmatter `version:` line (both bundles)
  - root SKILL.md sentence `Bundled agent crew version:` (both bundles)
  - policies/metadata.yaml crews.agents.version (both bundles)
  never_writes:
  - metadata.yaml root.version
  - metadata.yaml crews.skills.version
  - functional skill frontmatter versions
  - policies/agents/*.yaml
  - policies/models.yaml
  manual: root.version, crews.skills.version and skill frontmatter versions are bumped manually in both
    bundles (README Release versions).
  loop_guard: Bot commits carry `[skip agent-version-bump]` and the job skips github-actions[bot]; the
    bot writes no file under policies/agents/ or models.yaml.
policies:
  META-ROOT-001:
    title: Root skill frontmatter identity
    kind: metadata
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - runtime-loader
      - host
      - update-check
    defaults: {}
    exceptions: []
    platform_binding:
      description_word: fleets
    rules:
      META-ROOT-001.R01:
        key: name
        value: dev-dude
      META-ROOT-001.R02:
        key: version
        note: user-facing semantic release version; compared numerically by update check
        value_ref: root.version
        amendment:
          by: PCH-MOD-006
          reason: Version kept once in metadata root.version (bumped root release 1.1.0).
      META-ROOT-001.R03:
        key: description
        value: '...using agent fleets...'
        note: otherwise identical 5-line folded description listing arch/where, feature/write, update
        frontmatter_exact: 'Resumable architecture investigation and feature implementation using agent
          fleets. DudeWhereIsMyArch (arch/where) writes architecture docs to ./docs/ArchOverview/. DudeWriteMyFeature
          (feature/write) accepts descriptions, specs, or images and writes design, implementation, and
          verification outputs to ./docs/<feature-slug>/. update fetches the latest DevDude bundle and
          reloads supported runtimes.

          '
    planned_changes:
      PCH-MOD-006: policies/metadata.yaml#crews, policies/metadata.yaml#version_bump; .github/workflows/bump-agent-versions.yml
    source_nuance:
    - path: SKILL.md
      lines: 1-10
      text: "---\nname: dev-dude\nversion: <current value: installed frontmatter, see policies/metadata.yaml\
        \ crews>\ndescription: >\n  Resumable architecture investigation and feature implementation using\
        \ agent fleets.\n  DudeWhereIsMyArch (arch/where) writes architecture docs to ./docs/ArchOverview/.\n\
        \  DudeWriteMyFeature (feature/write) accepts descriptions, specs, or images and writes design,\n\
        \  implementation, and verification outputs to ./docs/<feature-slug>/.\n  update fetches the latest\
        \ DevDude bundle and reloads supported runtimes.\n---\n"
  META-ROOT-002:
    title: Root argument hints
    kind: metadata
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - runtime-loader
      - user
    defaults: {}
    exceptions: []
    rules:
      META-ROOT-002.R01:
        statement: 'Hints: update; models show; models profiles; models validate; models set <role|all>
          <model-id> --profile <name> --scope <project|user>; models use <profile|bundled-default> --scope
          <project|user>; models reset --scope <project|user>; DudeWhereIsMyArch all; all refresh; authentication
          refresh; DudeWhereIsMyArch authentication; DudeWriteMyFeature Add user caching'
        amendment:
          by: PCH-MOD-002
          reason: Models hints (every models grammar form) added to the displayed argument hints.
    resolutions:
      CNF-ROOT-001: argument-hint stays derived display text immediately after the root frontmatter; the
        authoritative list is META-ROOT-002 (metadata.yaml derived_display). It is not moved into frontmatter
        because no host documentation verified `argument-hint` as an accepted skill frontmatter key.
    source_nuance:
    - path: SKILL.md
      lines: 11-17
      text: "argument-hint:\n  - \"update\" — Update DevDude and reload its skills and agents\n  - \"\
        DudeWhereIsMyArch all\" — Full architecture investigation\n  - \"all refresh\" — Refresh affected\
        \ architecture docs\n  - \"authentication refresh\" — Refresh one architecture vertical\n  - \"\
        DudeWhereIsMyArch authentication\" — Investigate one area\n  - \"DudeWriteMyFeature Add user caching\"\
        \ — Design and implement a feature\n"
