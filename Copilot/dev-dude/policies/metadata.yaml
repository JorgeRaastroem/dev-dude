        examples:
        - auth request flow
        - debugging complex feature sequence
        - PR review of critical component
        - undocumented code
        encoding: \n
        frontmatter_exact: 'Use this agent when the user needs to understand how code execution flows
          through a codebase, particularly in medium to large repositories. Examples include:


          <example>

          Context: User is exploring an unfamiliar codebase and wants to understand request handling.

          user: "Can you show me how a user authentication request flows through this system?"

          assistant: "I''m going to use the Task tool to launch the code-flow-analyzer agent to trace
          the authentication flow through the codebase."

          <commentary>

          The user is asking to understand a specific execution path through the system. The code-flow-analyzer
          agent specializes in tracing code flows, analyzing test files to validate understanding, and
          creating visual diagrams, making it the perfect tool for this request.

          </commentary>

          </example>


          <example>

          Context: User is debugging a complex feature and needs to understand the sequence of operations.

          user: "I''m trying to fix a bug in the payment processing. Can you help me understand the flow
          from when a user clicks ''Pay'' to when the transaction completes?"

          assistant: "I''ll use the code-flow-analyzer agent to trace the payment processing flow and
          identify all the components involved."

          <commentary>

          This requires understanding execution sequences across multiple files and components. The code-flow-analyzer
          will examine the code, consult related tests to validate the flow, and provide a clear visualization
          of the process.

          </commentary>

          </example>


          <example>

          Context: User is reviewing a pull request with changes to a critical system component.

          user: "These changes modify the order fulfillment system. Can you help me understand what the
          current flow is and how these changes affect it?"

          assistant: "I''m going to launch the code-flow-analyzer agent to map out the existing order
          fulfillment flow and analyze how the proposed changes impact it."

          <commentary>

