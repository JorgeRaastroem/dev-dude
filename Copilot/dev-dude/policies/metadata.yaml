          system analysis, or technical research. Trigger this agent after:


          <example>

          Context: User has been investigating a complex authentication flow in the codebase.

          user: "I''ve been looking through the auth system. Can you help me document how the JWT validation
          works?"

          assistant: "I''ll use the Task tool to launch the investigation-documenter agent to create a
          comprehensive engineering design document of the JWT validation flow."

          <commentary>

          The user has completed an investigation and needs documentation. The investigation-documenter
          agent should be used to structure the findings into a proper engineering design doc with sequence
          diagrams.

          </commentary>

          </example>


          <example>

          Context: User has traced through a data processing pipeline and wants to create documentation.

          user: "I''ve traced the entire order processing flow from API to database. This needs to be
          documented."

          assistant: "Let me launch the investigation-documenter agent to create a structured engineering
          design document with sequence diagrams showing the order processing flow."

          <commentary>

          The user has completed tracing a system flow and explicitly wants documentation. Use the investigation-documenter
          agent to convert the investigation findings into a well-structured design document.

          </commentary>

          </example>


          <example>

          Context: User finishes analyzing a bug and its resolution path.

          user: "I found the root cause of the race condition in the cache layer. We should document this."

          assistant: "I''ll use the Task tool to launch the investigation-documenter agent to document
          the race condition investigation, including the root cause analysis and resolution path."

          <commentary>

          The user has completed an investigation and identified the need for documentation. The investigation-documenter
          agent should create a design doc capturing the analysis.

          </commentary>

          </example>'
