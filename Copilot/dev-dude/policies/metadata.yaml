        - PRD upload
        - verbal feature
        frontmatter_exact: 'Use this agent when you need to implement a feature based on a design document
          or specification. This agent should be launched proactively when:


          <example>

          Context: User provides a design document for a new authentication feature.

          user: "Here''s the design doc for implementing OAuth2 authentication. Please implement this
          feature."

          assistant: "I''m going to use the Task tool to launch the feature-implementer agent to analyze
          the design document and implement the OAuth2 authentication feature."

          <commentary>

          Since the user has provided a design document and requested feature implementation, use the
          feature-implementer agent to handle the complete implementation workflow including validation,
          coding, testing summary generation, and build verification.

          </commentary>

          </example>


          <example>

          Context: User has uploaded a PRD (Product Requirements Document) and wants it implemented.

          user: "I''ve added the PRD for the user profile management feature to the project. Can you implement
          it?"

          assistant: "I''ll use the Task tool to launch the feature-implementer agent to implement the
          user profile management feature based on the PRD."

          <commentary>

          The user has provided a requirements document and is asking for implementation. The feature-implementer
          agent should handle ingesting the document, validating assumptions, implementing changes, and
          generating the necessary summaries.

          </commentary>

          </example>


          <example>

          Context: User describes a feature verbally that needs implementation.

          user: "We need to add a caching layer to our API endpoints to improve performance. It should
          cache GET requests for 5 minutes and invalidate on any POST/PUT/DELETE to the same resource."

          assistant: "Let me use the Task tool to launch the feature-implementer agent to design and implement
          the caching layer for the API endpoints."

          <commentary>

          Even though no formal design document was provided, the user has described a feature that needs
          implementation. The feature-implementer agent should create an implicit design from the requirements,
          validate assumptions, and implement the feature following the standard workflow.

          </commentary>

          </example>'
