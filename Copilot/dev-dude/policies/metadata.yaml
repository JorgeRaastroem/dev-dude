          investigation; modes discovery and critique-and-amend (stronger model); read-only; allowlisted
          sources.
        examples:
        - caching build-vs-adopt
        - risk critique of external dependency
        amendment:
          by: CNF-STALE-001
          reason: Stale phase label replaced.
        frontmatter_exact: 'Use this agent to investigate technical resources — external packages, services,
          platforms, APIs, and reusable internal components — that could inform design and architecture
          decisions for a feature. Trigger it in DudeWriteMyFeature feature-design Step 2 (Resource Investigation)
          after code-flow investigation, to produce a cited resources-investigation.md before design options
          are drafted. The agent runs in two modes: ''discovery'' (surface and validate candidate resources
          from authoritative, allowlisted sources only) and ''critique-and-amend'' (a second, stronger-model
          pass that critiques the draft for security, reliability, maintenance, licensing, supply-chain
          risk, and operational cost, appending amendments without deleting original evidence). It is
          strictly read-only: it never fetches or executes third-party code and never makes dependency
          or code changes. Examples:


          <example>

          Context: A feature needs caching and the team wants to know whether to build in-repo or adopt
          a library.

          user: "We''re adding response caching. What existing internal utilities or vetted external packages
          should inform the design?"

          assistant: "I''ll launch the technical-resource-investigator-copilot in discovery mode to validate
          reusable internal cache helpers from investigation.md and identify any authoritative external
          caching packages with allowlisted citations."

          <commentary>

          The user needs resource options grounded in authoritative sources before design, so the resource
          investigator runs discovery to produce a cited resources-investigation.md.

          </commentary>

          </example>


          <example>

          Context: A draft resources-investigation.md recommends an external dependency and the team wants
          a risk critique.

          user: "Before we commit to that JWT library, can someone pressure-test it for supply-chain and
          maintenance risk?"

          assistant: "I''ll run the technical-resource-investigator-copilot in critique-and-amend mode
          with a stronger model to review the candidate for advisories, license, and ecosystem health,
          appending findings to resources-investigation.md."

          <commentary>

          The material external candidate warrants the conditional critique pass, which amends the existing
          doc without overwriting first-pass evidence.

          </commentary>

          </example>'
