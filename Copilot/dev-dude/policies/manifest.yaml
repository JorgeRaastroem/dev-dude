schema_version: '1.0'
bundle: copilot
domain: manifest
authority: DevDude normative policy lives in the YAML files indexed here. Markdown (SKILL.md, agent bodies,
  workflow.md, doc-format-templates.md, README) is loader instructions, examples, templates and explanation
  only.
loading:
  mode: instruction-driven
  enforcement: Hosts, the controller, stages and agents load these files because their Markdown loader
    instructions tell them to. No runtime component enforces loading; scripts/policy_audit.py checks repository
    consistency only and is not proof of host execution.
  root_discovery: policies/platform.yaml#root_discovery
  rules:
  - Resolve the policy root per platform.yaml root_discovery; never guess between installed roots.
  - Load every file of the selected load set with a YAML safe loader. A missing file, parse error, duplicate
    key, alias/anchor, or bundle value other than this bundle stops at POLICY LOAD GATE with the failing
    path; never fall back to deleted Markdown or memory.
  - Load additional files only when a loaded rule names them.
  - A policy whose scope.platforms excludes this bundle is absent here (see not_applicable).
  - Before applying any loaded file, verify it against the run policy snapshot per integrity (orchestrated
    runs); a mismatch stops at POLICY INTEGRITY GATE.
  precedence:
  - rule resolution entries (a recorded conflict or planned-change decision attached to a rule supersedes
    the legacy wording of that rule)
  - rule fields (including amendments)
  - policy resolutions
  - policy defaults/exceptions
  - 'source_nuance text (verbatim baseline excerpt with declared substitutions): binding only where it
    adds detail that the rule fields do not contradict; file names it mentions resolve through reference_map;
    version literals and stale paths are replaced by the declared substitutions'
  - nonnormative Markdown examples/templates
integrity:
  purpose: 'The manifest digest alone cannot detect edits to other policy files during a run. Run identity
    is therefore the full policy set: an immutable bundle revision plus a per-file SHA-256 for every file
    in `files` and this manifest.'
  hashing:
    tool: A runtime hashing command over exact file bytes, for example `sha256sum <file>`, `shasum -a
      256 <file>`, or PowerShell `Get-FileHash -Algorithm SHA256 <file>`. Record the command used.
    honesty: A model never estimates, recalls, or invents a hash. If no hashing tool is available, stop
      at POLICY INTEGRITY GATE before dispatch (no unverified continuation).
  policy_snapshot:
    computed_by: host at launch (load set host.launch), after root discovery and before bootstrap; passed
      in the bootstrap packet (BOOT-PKT-001.R13). The host writes no run outputs.
    written_by: controller, once before the first dispatch, after re-hashing every listed file and confirming
      the host values
    file: <run-output>/.dev-dude-policy-snapshot.yaml
    contents:
    - schema_version 1.0
    - bundle copilot
    - policy_root (absolute)
    - 'bundle_revision: metadata.yaml root.version, crews.agents.version, crews.skills.version, and the
      install marker commit SHA from <root>/.dev-dude-install.json when present (else unknown)'
    - 'files: every path in `files` plus policies/manifest.yaml, each with sha256:<hex>'
    - hashing command used
    digest: sha256 of the snapshot file bytes = Policy snapshot digest in run state, envelopes, handoffs
      and the model profile snapshot
  verification:
  - 'Controller entry and every resume (re-entry, recovery, gate relay): re-hash every file listed in
    the snapshot plus any file now present in `files`; any added, removed or changed file, or a snapshot
    digest that differs from run state, blocks at POLICY INTEGRITY GATE with the changed paths. No dispatch
    and no rebuild of the snapshot from current files.'
  - 'Stage and specialist load: re-hash every file of the load set being loaded and compare with the snapshot
    entries before applying it; mismatch returns blocked (POLICY INTEGRITY GATE).'
  - Root validation of every handoff (VAL-PASS-001.R06) compares policy_context with run state, including
    the policy snapshot digest.
  - The model profile snapshot records the policy snapshot digest it was validated under (models.yaml
    pinning); a difference blocks at MODEL PIN GATE.
  migration: An installed-bundle change during a run (for example a completed `update`) is never adopted
    silently and is not equivalent to tampering. Continuing under the new policy set requires verified
    quiescence of every invocation, an explicit quoted user decision, a new policy snapshot, model launch
    revalidation and re-pin (models.yaml pinning.repin), and a run-state amendment recording old and new
    digests. A missing or altered snapshot file is never migrated; it stays blocked.
  standalone: A standalone specialist (no envelope) has no run snapshot; it verifies only root discovery
    and the manifest, and creates no workflow state.
  limits: 'Instruction-driven: hashes detect changes only when the loader runs the hashing tool. scripts/policy_audit.py
    checks repository consistency, not runtime behaviour.'
