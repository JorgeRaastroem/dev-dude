source_nuance_substitutions:
- pattern: \[(?:references/)?(orchestration-state|stage-workflow|handoff-contract-schema|validation-rules|trusted-source-policy|argument-parsing)\.md\]\([^)]*\)
  replacement: REFMAP
- pattern: DudeWriteMyFeature Phase 1
  replacement: DudeWriteMyFeature feature-design Step 2 (Resource Investigation)
- pattern: must skip it and start at section 2;
  replacement: must skip the host steps and start at the controller load set;
- pattern: Sections 2–6 are executed only by the dedicated controller\.
  replacement: Controller steps (manifest load set `controller`) are executed only by the dedicated controller.
- pattern: completion gate for Phase 2 of `DudeWriteMyFeature`
  replacement: completion gate for the feature-implementation stage of `DudeWriteMyFeature`
- pattern: whether Phase 2 follows Phase 1 or
  replacement: whether feature implementation follows feature design or
- pattern: current Phase 2 state
  replacement: current feature-implementation state
- pattern: Phase 2 exits only on
  replacement: The feature implementation/validation loop exits only on
- pattern: to Phase 2 feature implementation verification
  replacement: to feature implementation verification
- pattern: '(?m)^version: \d+\.\d+\.\d+$'
  replacement: 'version: <current value: installed frontmatter, see policies/metadata.yaml crews>'
- pattern: 'Bundled agent crew version: `[^`]+`'
  replacement: 'Bundled agent crew version: `<policies/metadata.yaml crews.agents.version>`'
- pattern: 'Bundled skill crew version: `[^`]+`'
  replacement: 'Bundled skill crew version: `<policies/metadata.yaml crews.skills.version>`'
- pattern: \[references/workflow\.md\]\(references/workflow\.md\)
  replacement: '`references/workflow.yaml` (manifest load set `stage.<skill>`)'
- pattern: absolute shared-policy paths under this root's `references/`;
  replacement: the absolute `policies/manifest.yaml` locator and digest plus host-computed policy snapshot
    values (manifest.yaml integrity);
- pattern: and its installed frontmatter model\nalias,
  replacement: 'and the controller model ID

    from the resolved model profile (bundled-default: installed frontmatter `model` alias),'
- pattern: 'Invoke Task with `subagent_type: dev-dude-orchestrator`,'
  replacement: 'Invoke Task with `subagent_type: dev-dude-orchestrator` and the controller model ID from
    the resolved model profile,'
- pattern: this skill and its references supply workflow\nauthority
  replacement: 'the YAML policies indexed by `policies/manifest.yaml` supply workflow

    authority'
- pattern: '## 1\. Host Bootstrap — Prepare the Runtime\n\nThis section is host-only\.'
  replacement: '## Host Bootstrap — Prepare the Runtime


    The host steps (manifest load set `host.launch`) are host-only.'
- pattern: must pass the selected agent's reasoning-agnostic frontmatter `model` alias\.
  replacement: 'must pass the role model ID from the pinned model profile snapshot (bundled-default: the
    agent''s reasoning-agnostic frontmatter `model` alias).'
retained_prose:
  SKILL.md: Frontmatter (host-required, derived from metadata.yaml) + loader and step index; nonnormative.
  agents/*.md: Frontmatter (derived) + policy loader stub + nonnormative examples.
  skills/*/SKILL.md: Frontmatter (derived) + stage loader stub.
  skills/*/references/workflow.md: Nonnormative task-call examples and report skeletons.
  references/doc-format-templates.md: Nonnormative template bodies for TPL-* policies.
