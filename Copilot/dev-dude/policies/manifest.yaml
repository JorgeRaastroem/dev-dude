unbound_actors:
  runtime-loader: Host runtime reads frontmatter only; it never loads policy YAML.
  user: Humans read README/argument hints; not a policy consumer.
  TOOL-CI-001: GitHub workflow .github/workflows/bump-agent-versions.yml; reads/writes version lines with
    regexes per metadata.yaml version_bump (trigger and write set), not load sets.
  workflow maintainers: Maintainers edit and audit files; not a runtime consumer.
informative_references:
  CNF-STALE-001->FVAL-FEAT-001: Changelog of relabelled rules; names the rule that was relabelled, not
    a dependency.
  CNF-STALE-001->AGT-TRI-META-001: Changelog of relabelled rules; names the rule that was relabelled,
    not a dependency.
  CNF-DRIFT-003->AGT-AR-001: Notes the dispatched reviewer behaviour; the reviewer loads its own role
    file (specialist.architecture-reviewer).
  CNF-CONC-002->ARCH-P3-001: Concurrency cap applies only to architecture verification batches, which
    load the architecture workflow.
  CNF-ASK-004->OUT-STABLE-001: Orchestrated agents receive the concrete storage paths in the envelope
    Expected output; standalone agents ask. The agent never resolves OUT-STABLE-001 itself.
  AGT-ID-002->ARCH-P2-001: Provenance of the write-permission exception; the envelope write permission
    is the operative evidence.
  CNF-STALE-001->UPD-CMD-001: Changelog of relabelled rules; names the update staging rule that was amended,
    not a dependency.
