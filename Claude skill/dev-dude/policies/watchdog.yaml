schema_version: '1.0'
bundle: claude
domain: watchdog
authority: Normative DevDude policy. Rule fields are authoritative; see policies/manifest.yaml loading.precedence.
policies:
  DISP-WD-001:
    title: Root watchdog for functional-skill dispatch
    kind: policy
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - orchestrator
      - functional skills
    defaults: {}
    exceptions: []
    rules:
      DISP-WD-001.R01:
        statement: Apply orchestration-state watchdog while skill runs in selected mode; checkpoint invocation;
          monitor against handoff and run state; preserve bounded polls in controlled mode.
      DISP-WD-001.R02:
        statement: Cooperative deadlines are monitoring thresholds, not guaranteed interruption or bounded
          return time.
      DISP-WD-001.R03:
        statement: Record `deadline exceeded` separately from `execution status unknown` and `verified
          stopped`; never claim cancellation without evidence.
      DISP-WD-001.R04:
        statement: Pause recovery (not initial dispatch) when prior work may be active; no retry/replacement/overlapping
          writes until invocation + descendants completed/verified stopped; reconcile partial outputs
          first.
      DISP-WD-001.R05:
        statement: Root alone writes run state; reconciles stage-owned journal at checks and on return/resume.
      DISP-WD-001.R06:
        statement: At approval gate stage returns blocked handoff and stops; root asks without deadline;
          re-dispatch only after explicit decision recorded in new validated handoff.
      DISP-WD-001.R07:
        statement: Functional skills select and record mode for their own agent/tool/shell invocations;
          safety concerns, uncertain side effects, conflicts, scope changes still require gates.
    source_nuance:
    - path: SKILL.md
      lines: 276-289
      text: 'Apply the watchdog in `policies/state.yaml + policies/watchdog.yaml` while the

        functional skill runs in its selected mode. Checkpoint its invocation and monitor against the

        validated handoff and run state as the runtime permits; preserve bounded polls in controlled mode.

        Cooperative deadlines are monitoring thresholds, not guaranteed interruption or bounded return

        time. Record `deadline exceeded` separately from `execution status unknown` and `verified stopped`;

        never claim cancellation without evidence. Pause recovery, not initial dispatch, when prior work

        may still be active. Do not retry, replace work, or permit overlapping writes until the invocation

        and descendants have completed or are verified stopped; reconcile partial outputs first.

        Root alone writes run state and reconciles the stage-owned journal at available checks and on
        return

        or resume. At an approval gate the stage returns a `blocked`

        handoff and stops; root then asks the user without a deadline and re-dispatches only after an

        explicit decision is recorded in a new validated handoff.

        Functional skills select and record the appropriate mode for their own agent, tool, and shell

        invocations. Safety concerns, uncertain side effects, conflicts, and scope changes still require
        gates.

        '
  WD-MODE-001:
    title: Execution modes (controlled / cooperative)
    kind: policy
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - orchestrator
      - functional skills
    defaults:
      preferred: background-bounded-polls
    exceptions: []
    rules:
      WD-MODE-001.R01:
        statement: Root monitors functional-skill dispatches; each skill monitors its agents/tools/shell
          commands; select and record mode per invocation from verified capabilities.
      WD-MODE-001.R02:
        statement: 'Controlled: verified background execution with bounded polls + cancellation callable
          while active, or runtime-enforced timeout returning within check interval; cancellation tool
          alone insufficient; retain mechanism; cancel/timeout at deadline; verify termination incl. descendants
          before recovery.'
      WD-MODE-001.R03:
        statement: 'Cooperative: no usable control verified for this invocation (even if advertised elsewhere);
          dispatch via supported mechanism incl. synchronous; no approval merely for missing cancellation;
          record limitation before launch; instruct bounded objective, checkpoints, partial/blocked returns;
          deadlines are thresholds; no guaranteed interruption or bounded return; prompts cannot interrupt
          hung sync calls.'
      WD-MODE-001.R04:
        statement: Prefer background + bounded polls when supported; in sync cooperative root may be unable
          to check; reconcile on return/resume; never promise unavailable cadence.
      WD-MODE-001.R05:
        statement: User-decision gates are not timed or retried; safety/side-effect/conflict/scope issues
          still need explicit gate.
    source_nuance:
    - path: references/orchestration-state.md
      lines: 127-152
      text: "## Watchdog\n\nThe root owns monitoring for functional-skill dispatches; each functional\
        \ skill owns it for\ndelegated agents, external tools, and shell commands within its stage. Select\
        \ and record a mode\nper invocation based on verified capabilities, not assumptions about a background\
        \ wrapper:\n\n- **Controlled mode:** verify a usable control mechanism for this specific invocation:\
        \ either\n  background execution with bounded status polls and cancellation callable while work\
        \ is active,\n  or a runtime-enforced timeout returning control within the check interval. A cancellation\
        \ tool\n  alone is insufficient if the invocation prevents monitoring or calling it. Retain the\
        \ verified\n  mechanism. Request cancellation or let the enforced timeout act at the deadline\n\
        \  if still active. Verify termination of the invocation and descendants before recovery.\n- **Cooperative\
        \ mode:** neither usable control mechanism is verified for this invocation, even if\n  the runtime\
        \ advertises cancellation elsewhere. Dispatch through the runtime's supported\n  invocation mechanism,\
        \ including synchronous calls when necessary; do not require user approval\n  merely because cancellation\
        \ is unavailable. Record the limitation before launch. Instruct work to\n  stay within its bounded\
        \ objective, checkpoint progress through its owner, and return partial or\n  blocked results with\
        \ a continuation point when appropriate. Deadlines are monitoring thresholds,\n  not guaranteed\
        \ interruption. Cooperative monitoring cannot guarantee interruption or bounded\n  return time;\
        \ prompts cannot interrupt a hung synchronous call.\n\nPrefer background execution and bounded\
        \ polls when supported. In cooperative synchronous execution,\nroot may be unable to check while\
        \ the call is active; the stage checkpoints its journal as control\npermits, and root reconciles\
        \ on return or resume. Do not promise a check cadence the runtime cannot\nprovide. User-decision\
        \ gates are not timed or retried. Genuine safety concerns, uncertain side\neffects, conflicting\
        \ work, and scope changes still require an explicit gate.\n"
  WD-JOURNAL-001:
    title: Single-writer state and stage journals
    kind: policy
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - orchestrator
      - functional skills
      - agents
    defaults:
      journal_dir: .dev-dude-watchdog/
    exceptions: []
    rules:
      WD-JOURNAL-001.R01:
        statement: Only root writes .dev-dude-run-state.md incl. task/gate transitions and consolidated
          watchdog table.
      WD-JOURNAL-001.R02:
        statement: Root assigns stage invocation ID and journal <run-output>/.dev-dude-watchdog/<invocation-id>.md;
          stage is sole writer; never edits run state.
      WD-JOURNAL-001.R03:
        statement: Stage records own status/last update and each child action's parent ID, invocation
          ID, mode/capabilities, start/deadline, retry count, last check, execution status, outcome, evidence.
      WD-JOURNAL-001.R04:
        statement: Root reads journal at each check/return and copies reconciled facts; missing/stale/conflicting
          journal data cannot prove a child stopped.
      WD-JOURNAL-001.R05:
        statement: Delegated agents report to stage owner and never edit either file; 'checkpoint' inside
          a functional workflow means write the stage journal.
      WD-JOURNAL-001.R06:
        statement: Preserve journals until referenced invocations quiescent and indexed; restarted stage
          reads prior journals + run state before choosing retry count; new invocation ID never resets
          retry budget.
    source_nuance:
    - path: references/orchestration-state.md
      lines: 154-170
      text: '## Single-writer and nested actions


        Only root writes `.dev-dude-run-state.md`, including task/gate transitions and the consolidated

        watchdog table. For each stage invocation, root assigns an invocation ID and a stage-owned journal

        at `<run-output>/.dev-dude-watchdog/<invocation-id>.md`, and passes its path to that stage. The
        stage

        is the sole writer of its journal; it never edits the run state. Before dispatch and after each

        check/result, the stage records its own status and last update, plus each child action''s parent
        ID,

        invocation ID, mode and capabilities/limitations, start/deadline, retry count, last check,

        execution status, outcome, and evidence in its journal.

        Root reads the journal at every available check or return and copies reconciled facts into the
        run

        state; missing, stale, or conflicting journal data cannot prove a child stopped. Delegated agents

        report results to their stage owner and never edit

        either file. Checkpoint instructions within a functional workflow mean write the stage journal

        and let root reconcile it into run state. Preserve journals across resumes until all referenced

        invocations are quiescent and their evidence is indexed in the run state. A restarted stage reads

        prior journals and the run state for that action ID before choosing a retry count; a new stage

        invocation ID never resets an action''s retry budget.

        '
  WD-DEADLINE-001:
    title: Deadlines, checks, termination evidence
    kind: policy
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - orchestrator
      - functional skills
    defaults:
      check_interval_seconds: 60
      deadline_minutes: 10
      max_poll_wait_seconds: 60
    exceptions:
    - justified longer deadline recorded before start
    rules:
      WD-DEADLINE-001.R01:
        statement: Root deadline applies to stage invocation; each child has own mode/deadline/retry budget
          in stage journal.
      WD-DEADLINE-001.R02:
        statement: Root may request cancellation of a deadline-exceeded stage in controlled mode only
          after examining its journal; confirm stage + descendants completed/verified stopped before redispatch.
      WD-DEADLINE-001.R03:
        statement: 'If any may remain active: no retry, replacement, advancement, overlapping writes (incl.
          cleanup); unknown pauses recovery not initial dispatch; approval is not termination evidence.'
      WD-DEADLINE-001.R04:
        statement: 'Stage-requested gate is not a running invocation: blocked handoff, stop, root validates,
          records waiting-for-user, asks without deadline; next invocation only after explicit decision
          + new validated same-stage handoff.'
      WD-DEADLINE-001.R05:
        statement: Before each action assign stable action ID (task, step, tool/action) and record start,
          mode, deadline, invocation ID, retry count in owner's file.
      WD-DEADLINE-001.R06:
        key: check_interval_seconds
        value: 60
        statement: Default check interval 60 s.
      WD-DEADLINE-001.R07:
        key: deadline_minutes
        value: 10
        statement: Default deadline 10 minutes per attempt; longer needs justified deadline recorded before
          start; never extend a running attempt; new deadline per retry with same action ID/retry count.
      WD-DEADLINE-001.R08:
        statement: Where polling supported use bounded waits <= 60 s and check each concurrent action
          at least every 60 s; otherwise record unavailable live monitoring and reconcile when control
          returns.
      WD-DEADLINE-001.R09:
        statement: At each check read run state, journal, validated input handoff; restate objective,
          completion evidence, permitted transition; reconcile results with outputs/repo; record time
          and evidence; missing/invalid handoff blocks progress.
      WD-DEADLINE-001.R10:
        statement: At/after deadline record `deadline exceeded` separately; controlled+active -> request
          cancellation/enforced timeout then verify; cooperative+active -> keep monitoring, no retry;
          undeterminable -> `execution status unknown` + recovery-paused; never mark failed/cancelled
          for elapsed time; `verified stopped`/`completed` need evidence covering descendants; never mark
          cancelled without verified evidence.
    source_nuance:
    - path: references/orchestration-state.md
      lines: 172-208
      text: 'Root''s deadline applies to the stage invocation, not independently to its child actions.
        Each

        child has its own mode, deadline, and retry budget in the stage journal. Root may request cancellation

        of a deadline-exceeded stage in controlled mode only after examining its journal; confirm both
        the

        stage and all descendants have completed or are verified stopped before redispatch. If any may

        remain active, do not retry, launch replacement work, advance the stage, or allow overlapping
        writes

        (including cleanup of their artifacts). Unknown status pauses recovery, not initial dispatch;
        user

        approval alone is not termination evidence. A gate requested by a stage is not a running invocation:

        the stage returns a `blocked` handoff and stops, then root validates it, records

        `waiting-for-user`, and asks without a deadline. The next invocation starts only after explicit

        decision evidence and a new validated same-stage handoff.


        Before each action, assign a stable action ID (task ID, step, and tool/action), record its start,

        mode and capabilities/limitations, deadline, invocation identifier if available, and retry count
        in

        its owner''s file (run state for root actions, stage journal for child actions). Default to a

        60-second check interval and a 10-minute deadline per attempt. For an action expected to need

        longer, record a justified deadline *before* starting it; never extend a running attempt''s

        deadline merely because it is still running. Start a new deadline for each retry, preserving the

        same action ID and retry count across resumes. Where the runtime supports polling, use bounded
        waits

        of at most 60 seconds and check each concurrent action at least every 60 seconds. Otherwise record

        the unavailable live monitoring and reconcile as soon as control returns.


        At each check, read the run state, stage journal when applicable, and validated input handoff;

        restate the current step''s objective, completion evidence, and permitted next transition, then

        reconcile completed results with actual

        outputs and repository changes. Record the check time and evidence. If an action is still active

        before its deadline, continue bounded polling; a completed action follows normal contract

        validation. A missing or invalid handoff blocks progress, never authorizes an inferred next step.


        At or on the first available check after the deadline, record `deadline exceeded` separately from

        execution status. If still active in controlled mode, request cancellation of the specific

        invocation (or let its enforced timeout act), then verify termination; a request is not proof
        it stopped.

        In cooperative mode, continue monitoring a known active invocation without retrying it. If status

        cannot be established in either mode, record `execution status unknown` with the available evidence

        and set `recovery-paused`; do not mark the task failed or cancelled merely because time elapsed.

        Record `verified stopped` or `completed` only with evidence covering the invocation and descendants

        (runtime status/result references or other verified termination evidence, not missing artifacts).

        Never mark an invocation cancelled without verified cancellation evidence.

        '
  WD-RETRY-001:
    title: Retry budget and recovery
    kind: policy
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - orchestrator
      - functional skills
    defaults:
      max_retries_after_initial: 3
    exceptions: []
    rules:
      WD-RETRY-001.R01:
        statement: Resume recovery only after completion/verified termination of all prior work; reconcile
          partial outputs and side effects; validate complete result normally even if deadline exceeded.
      WD-RETRY-001.R02:
        key: max_retries_after_initial
        value: 3
        statement: Retry only the same incomplete, safe-to-repeat action up to three retries after initial
          attempt; record each before dispatch.
      WD-RETRY-001.R03:
        statement: Never replay completed work, non-idempotent side effects, or actions whose prior invocation/descendants
          may run.
      WD-RETRY-001.R04:
        statement: 'Unknown status: stage reports in journal, root pauses recovery; no approval needed
          solely for missing cancellation.'
      WD-RETRY-001.R05:
        statement: Unsafe repeat (safety, side effects, conflicting work, scope change) -> waiting-for-user
          gate with evidence; approval never bypasses quiescence.
      WD-RETRY-001.R06:
        statement: After third failed retry owner records exhaustion; root marks task failed and run bounded-unresolved;
          no advance to another stage.
      WD-RETRY-001.R07:
        statement: Watchdog retry budget independent of feature validation attempt counter; reuse persisted
          count on resume; never reset to evade exhaustion.
    source_nuance:
    - path: references/orchestration-state.md
      lines: 210-225
      text: 'Resume recovery only after completion or verified termination of all prior work. Reconcile
        partial

        outputs and side effects before deciding whether the action remains incomplete; validate a complete

        result normally even if its deadline was exceeded. Retry only the same incomplete

        action when it is safe to repeat, up to **three retries after the initial attempt**, recording

        each attempt before dispatch. Do not replay completed work, non-idempotent side effects, or an

        action whose prior invocation or descendants may still be running. If status is unknown, the stage

        reports the uncertainty in its journal and root pauses recovery; no user approval is needed solely

        for the missing cancellation capability. If a safe repeat cannot be established because of genuine

        safety concerns, uncertain side effects, conflicting work, or scope changes, root sets

        `waiting-for-user` and asks at a gate with the evidence. Approval never bypasses the quiescence
        check.

        After the third failed retry, the action owner records exhaustion (root in run state, stage in
        its

        journal); root marks the task failed and the run `bounded-unresolved`, recording the failure and

        exhausted budget. Do not

        advance to another stage. The watchdog retry budget is

        independent of the feature validation/remediation attempt counter. On resume, reconcile evidence

        and reuse the persisted count; never reset it to evade exhaustion.

        '
  FSK-MON-001:
    title: Functional skill monitoring clause (shared text, 4 skills)
    kind: policy
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - functional skills
    defaults: {}
    exceptions: []
    rules:
      FSK-MON-001.R01:
        statement: Apply supplied controlled/cooperative monitoring to every child invocation.
      FSK-MON-001.R02:
        statement: Record capabilities/limitations in stage journal, checkpoint progress, return partial/blocked
          when appropriate.
      FSK-MON-001.R03:
        statement: Missing cancellation alone does not block dispatch; elapsed deadline does not prove
          termination.
      FSK-MON-001.R04:
        statement: No retry/replacement/overlapping writes until prior work and descendants quiescent
          and partial outputs reconciled.
    source_nuance:
    - path: skills/dev-dude-architecture/SKILL.md
      lines: 13-17
      text: 'Apply the supplied orchestration-state policy''s controlled/cooperative monitoring to every
        child

        invocation. Record capabilities and limitations in the stage journal, checkpoint progress, and

        return partial or blocked results when appropriate. Missing cancellation alone does not block

        dispatch; an elapsed deadline does not prove termination. No retry, replacement, or overlapping

        writes until prior work and descendants are confirmed quiescent and partial outputs reconciled.

        '
