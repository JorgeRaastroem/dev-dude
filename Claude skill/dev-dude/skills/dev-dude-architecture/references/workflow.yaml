      ARCH-P4-001.R03:
        platform: claude
        statement: If criteria missing interview user and create lightweight rubric.
      ARCH-P4-001.R04:
        statement: Produce Future Considerations list; output .tmp/architecture-review.md.
    resolutions:
      CNF-ASK-001: 'Orchestrated mode (envelope present): any step that would ask or wait for the user
        returns `blocked` to the invoking stage with the exact question, options and proposed default;
        the stage returns a blocked handoff; root records waiting-for-user and asks. Standalone mode (no
        envelope) keeps interactive asking unchanged.'
      CNF-DRIFT-003: Copilot Phase 4 omits the explicit rubric interview line; AGT-AR-001 still establishes
        criteria when absent through the CNF-ASK-001 blocked gate in orchestrated mode. No workflow text
        added.
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 131-143
      text: "### Phase 4: Architecture Review (blocked by Phase 3)\n\n```\nArchitecture-Reviewer task:\n\
        \  Input:\n    - Final architecture overview + active vertical deep-dive documents\n    - All\
        \ verification reports\n  Process:\n    - Critique the mapped architecture for reusability, performance,\
