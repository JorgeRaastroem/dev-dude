schema_version: '1.0'
bundle: claude
domain: workflow
skill: dev-dude-architecture
skill_version_ref: policies/metadata.yaml#crews.skills.version
authority: Normative DevDude policy. Rule fields are authoritative; see policies/manifest.yaml loading.precedence.
policies:
  ARCH-PRE-001:
    title: Architecture workflow preamble (monitoring, ownership, per-task envelope)
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults: {}
    exceptions: []
    rules:
      ARCH-PRE-001.R01:
        statement: Detailed steps for DudeWhereIsMyArch.
      ARCH-PRE-001.R02:
        statement: Examples follow controlled/cooperative policy; background + bounded polls when supported
          else record unavailable monitoring; deadlines/missing outputs do not prove stop; resume/retry
          only after quiescence + reconciliation.
      ARCH-PRE-001.R03:
        statement: Root owns transitions; reconcile ./docs/ArchOverview/.dev-dude-run-state.md; load at
          first incomplete step; return when exit contract met.
      ARCH-PRE-001.R04:
        statement: Before every delegated task add envelope + $INDEXER_CONTEXT; checkpoint before launch
          and after result; .tmp/final documents are evidence, not substitutes for task result.
      ARCH-PRE-001.R06:
        statement: Return control at Vertical Review Gate; root presents and re-dispatches after explicit
          decision.
    planned_changes:
      PCH-MOD-004: policies/models.yaml#resolution, policies/models.yaml#pinning
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 1-18
      text: '# Architecture Investigation Workflow


        Detailed steps for the `DudeWhereIsMyArch` command.


        All execution examples follow the supplied controlled/cooperative monitoring policy. Background

        launches and bounded polls apply when supported; otherwise use the runtime''s supported invocation

        and record unavailable live monitoring. Neither deadlines nor missing outputs prove work stopped.

        Resume or retry only after prior invocations and descendants are confirmed quiescent and reconciled.


        The root orchestrator owns transitions and checkpoints using the orchestration contract supplied
        at

        invocation. Reconcile

        `./docs/ArchOverview/.dev-dude-run-state.md`, load this block at its first incomplete step, and

        return control when the exit contract is met.


        Before every delegated task, add the orchestration envelope and `$INDEXER_CONTEXT`, then checkpoint

        the task before launch and after its result. Expected `.tmp/` or final documents are completion

        evidence, not substitutes for the task result. Return control to root at the Vertical Review Gate;

        root records and presents the gate and re-dispatches this stage after an explicit decision.

        '
  ARCH-P0-001:
    title: Phase 0 codebase discovery
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults: {}
    exceptions:
    - 'Copilot: grep/glob/view fallback when indexer absent (CTX-IDX-001)'
    rules:
      ARCH-P0-001.R01:
        statement: Scan project root via indexer list_dir (e.g. mcp__serena__list_dir).
      ARCH-P0-001.R02:
        statement: Read indexer memories/context.
      ARCH-P0-001.R03:
        statement: 'Identify package/module boundaries: package.json, Cargo.toml, go.mod, pom.xml, build.gradle,
          pyproject.toml; find_file; scan src/, packages/, libs/, modules/, apps/, services/.'
      ARCH-P0-001.R04:
        statement: Identify tech stack from root config.
      ARCH-P0-001.R05:
        statement: Build area list.
      ARCH-P0-001.R06:
        statement: Identify entry points.
      ARCH-P0-001.R07:
        statement: 'Output: structured list of areas with paths and descriptions.'
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 20-34
      text: "## Phase 0: Codebase Discovery\n\nBefore any investigation, dynamically discover the project\
        \ structure:\n\n1. **Scan project root**: Use the indexer's `list_dir` capability (e.g., `mcp__serena__list_dir(\"\
        .\", recursive=false)`) to see top-level structure\n2. **Read indexer memories/context**: Use\
        \ the indexer's memory/context tools (e.g., `mcp__serena__list_memories()`) then read relevant\
        \ ones for existing context\n3. **Identify package/module boundaries**:\n   - Look for `package.json`,\
        \ `Cargo.toml`, `go.mod`, `pom.xml`, `build.gradle`, `pyproject.toml` etc.\n   - Use `find_file`\
        \ capability (e.g., `mcp__serena__find_file(\"package.json\", \".\")`) or equivalent for the project's\
        \ language\n   - Scan key directories: `src/`, `packages/`, `libs/`, `modules/`, `apps/`, `services/`\n\
        4. **Identify tech stack**: Read root config files to determine languages, frameworks, build tools\n\
        5. **Build area list**: Create a list of investigation areas from discovered modules/packages/directories\n\
        6. **Identify entry points**: Look for main files, app entry points, server startup, route definitions\n\
        \nOutput: A structured list of areas to investigate with paths and brief descriptions.\n"
  ARCH-BASE-001:
    title: Base investigation trigger
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults: {}
    exceptions: []
    rules:
      ARCH-BASE-001.R01:
        statement: Triggered when area is all/broad OR ./docs/ArchOverview/ does not exist.
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 36-38
      text: '## Base Investigation (Full Codebase)


        Triggered when area is "all"/broad OR `./docs/ArchOverview/` doesn''t exist.

        '
  ARCH-P1-001:
    title: Phase 1 parallel investigation
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults:
      max_concurrent_agents: '6'
    exceptions: []
    amendment:
      by: CNF-CONC-001
      reason: Root max 6.
      changed:
      - defaults
    rules:
      ARCH-P1-001.R01:
        platform: claude
        statement: TeamCreate 'arch-investigation'.
      ARCH-P1-001.R02:
        statement: Per area Task A Code-Flow-Analyzer 'Investigate <area>' inputs path, description, entry
          points (+ $INDEXER_CONTEXT on Copilot); output ./docs/ArchOverview/.tmp/<area-slug>.md.
      ARCH-P1-001.R03:
        statement: Per area Task B UX-Design-Reviewer 'Review UX for <area>' inputs path/scope, screens/specs,
          UX guidelines (or instruction to interview user and create them); output .tmp/ux-<area-slug>.md.
      ARCH-P1-001.R04:
        key: max_concurrent_agents
        value: '6'
        statement: At most 6 Phase 1 agents (Code-Flow-Analyzer + UX-Design-Reviewer) run concurrently
          on either platform; batch remaining areas.
        amendment:
          by: CNF-CONC-001
          reason: Root max of 6 applies on both platforms.
      ARCH-P1-001.R06:
        statement: 'CFA per task: get_symbols_overview; trace flows via find_symbol/find_referencing_symbols;
          map deps/integrations; document patterns; mermaid diagrams.'
    resolutions:
      CNF-CONC-001: 'Root authority wins: at most 6 concurrent Phase 1 agents on both platforms; remaining
        areas are batched. The baseline 4-6 lower bound was guidance, not a minimum.'
      CNF-ASK-001: 'Orchestrated mode (envelope present): any step that would ask or wait for the user
        returns `blocked` to the invoking stage with the exact question, options and proposed default;
        the stage returns a blocked handoff; root records waiting-for-user and asks. Standalone mode (no
        envelope) keeps interactive asking unchanged.'
    retained_prose:
    - path: skills/dev-dude-architecture/references/workflow.md
      content: task-call examples
      reason: Illustrative dispatch examples; rules in workflow.yaml.
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 40-72
      text: "### Phase 1: Parallel Investigation\n\n```\nTeamCreate → \"arch-investigation\"\n\nFor each\
        \ discovered area, create two parallel tasks:\n  Task A: \"Investigate <area-name>\"\n    Agent:\
        \ Code-Flow-Analyzer\n    Input:\n      - Area path (e.g., \"packages/core/auth/\")\n      - Area\
        \ description from discovery\n      - Key entry points identified\n    Output:\n      - ./docs/ArchOverview/.tmp/<area-slug>.md\n\
        \n  Task B: \"Review UX for <area-name>\"\n    Agent: UX-Design-Reviewer\n    Input:\n      -\
        \ Area path or user-facing scope\n      - Existing screens/specs relevant to the area\n      -\
        \ Any project UX guidelines (or instruction to interview user and create them)\n    Output:\n\
        \      - ./docs/ArchOverview/.tmp/ux-<area-slug>.md\n\nAll area task pairs run in parallel (max\
        \ 4-6 concurrent agents total).\n```\n\nEach Code-Flow-Analyzer task should (using the indexer\
        \ tools from `$INDEXER_CONTEXT`):\n1. Use `get_symbols_overview` (or equivalent) on key files\
        \ in the area\n2. Trace major flows from entry points using `find_symbol` and `find_referencing_symbols`\
        \ (or equivalent)\n3. Map internal dependencies and external integration points\n4. Document patterns,\
        \ conventions, and design decisions\n5. Create mermaid diagrams for major flows\n"
  ARCH-P2-001:
    title: Phase 2 documentation
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults: {}
    exceptions: []
    rules:
      ARCH-P2-001.R01:
        statement: Every investigation-documenter task launched with write permissions.
      ARCH-P2-001.R02:
        statement: Capture git rev-parse HEAD before writing; set full SHA as **Source Commit** in overview
          and every deep-dive.
      ARCH-P2-001.R03:
        statement: 'Task 1 overview (needs all Phase 1): inputs all .tmp area + ux files; output <project>-architecture-overview.md;
          exec summary, mermaid HL diagram, area summaries/cross-refs, text-only UX collateral, glossary.'
      ARCH-P2-001.R04:
        statement: 'Tasks 2-N deep-dives (each blocked by own Phase 1 task): output <project>-<area-slug>.md;
          component breakdown, data flow, interfaces, dependencies (+ text-only layout maps on Copilot).'
    resolutions:
      CNF-ASK-002: 'Orchestrated: write permission plus an Expected output path in the envelope is the
        user-authorized approval for exactly those paths, including in-place delta updates; other paths
        need a blocked gate. Delta refresh "ask before Base fallback" becomes a blocked handoff gate.
        Standalone keeps "May I create this file at [path]?".'
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 74-102
      text: "### Phase 2: Documentation (blocked by Phase 1)\n\n```\nInvestigation-Documenter tasks:\n\
        \nEvery `investigation-documenter` task must be launched with write permissions.\n\nCapture `git\
        \ rev-parse HEAD` before writing documents and set that full SHA as `**Source Commit**`\nin the\
        \ overview and every deep-dive.\n\nTask 1: Overview document (blocked by ALL Phase 1 tasks)\n\
        \  Permissions: write\n  Input: All .tmp/<area>.md and .tmp/ux-<area>.md files\n  Output: ./docs/ArchOverview/<project>-architecture-overview.md\n\
        \  - Executive summary\n  - High-level architecture diagram (mermaid)\n  - Area summaries with\
        \ cross-references\n  - UX collateral where relevant (simple text-only layout maps)\n  - Glossary\n\
        \nTasks 2-N: Deep-dive documents (each blocked by its own Phase 1 task)\n  Permissions: write\n\
        \  Input: .tmp/<area>.md and .tmp/ux-<area>.md for the specific area\n  Output: ./docs/ArchOverview/<project>-<area-slug>.md\n\
        \  - Detailed component breakdown\n  - Data flow diagrams\n  - Key interfaces\n  - Dependencies\n\
        ```\n"
  ARCH-GATE-001:
    title: Vertical Review Gate
    kind: gate
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
      - orchestrator
    defaults: {}
    exceptions: []
    rules:
      ARCH-GATE-001.R01:
        statement: 'After Phase 2, before Phase 3: return blocked handoff with editable vertical list
          (name, description, deep-dive path).'
      ARCH-GATE-001.R02:
        statement: Root validates, records waiting-for-user, asks operator to confirm, exclude, or add
          (requesting path/description).
      ARCH-GATE-001.R03:
        statement: Do not keep stage running while waiting; re-dispatch with decision in new validated
          handoff.
      ARCH-GATE-001.R04:
        statement: 'Exclusions: remove from active list; update overview summaries/cross-refs/diagrams;
          keep deep-dive but exclude from Phases 3-5.'
      ARCH-GATE-001.R05:
        statement: 'Additions: run Phases 1-2 for each and update overview.'
      ARCH-GATE-001.R06:
        statement: After any change return new blocked handoff with revised list for re-confirmation.
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 104-116
      text: "### Vertical Review Gate (blocked by Phase 2; blocks Phase 3)\n\nReturn a `blocked` handoff\
        \ to root with an editable vertical list. For each vertical, include its\nname, brief description,\
        \ and deep-dive document path. Root validates the handoff, records\n`waiting-for-user`, and asks\
        \ the operator to confirm the list, exclude named verticals, or add\nverticals (requesting a path\
        \ or brief description when needed). Do not keep this stage running\nwhile waiting; root re-dispatches\
        \ it with the recorded decision in a new validated handoff.\n\n- For exclusions, remove the vertical\
        \ from the active list and update the overview's summaries,\n  cross-references, and diagrams.\
        \ Keep its generated deep-dive, but do not include it in Phases 3-5.\n- For additions, run Phases\
        \ 1 and 2 for each new vertical and update the overview to include it.\n- After any change, return\
        \ a new `blocked` handoff with the revised list, including newly generated\n  deep-dives, for\
        \ root to request confirmation again.\n"
  ARCH-P3-001:
    title: Phase 3 verification
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults: {}
    exceptions: []
    rules:
      ARCH-P3-001.R01:
        statement: One CFA per document (overview + each active vertical), parallel.
      ARCH-P3-001.R02:
        statement: Verify every file path, symbol/class/interface, snippet, dependency claim.
      ARCH-P3-001.R03:
        statement: Output .tmp/verification-<doc>.md.
      ARCH-P3-001.R05:
        added_by: CNF-CONC-002
        statement: Batch Phase 3 and additive/delta Code-Flow-Analyzer verification tasks so at most 6
          run concurrently.
    resolutions:
      CNF-CONC-002: Phase 3 and additive/delta verification batch Code-Flow-Analyzer tasks to at most
        6 concurrent (added rule ARCH-P3-001.R05).
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 118-129
      text: "### Phase 3: Verification (blocked by the Vertical Review Gate)\n\n```\nCode-Flow-Analyzer\
        \ tasks (one per document, parallel):\n  Input: The overview or an active vertical's generated\
        \ document\n  Process:\n    - Verify every file path exists\n    - Verify every symbol/class/interface\
        \ exists\n    - Verify code snippets match actual code\n    - Verify dependency claims\n  Output:\
        \ ./docs/ArchOverview/.tmp/verification-<doc>.md\n```\n"
  ARCH-P4-001:
    title: Phase 4 architecture review
    kind: workflow
    scope:
