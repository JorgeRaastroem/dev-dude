          note unverifiable items.
      ARCH-P5-001.R03:
        statement: Output updated docs in ./docs/ArchOverview/; remove .tmp/.
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 145-158
      text: "### Phase 5: Fix Application (blocked by Phase 4)\n\n```\nInvestigation-Documenter task:\n\
        \  Permissions: write\n  Input: All verification reports and ./docs/ArchOverview/.tmp/architecture-review.md\n\
        \  Process:\n    - Apply corrections to documents\n    - Update inaccurate file paths, symbol\
        \ names, descriptions\n    - Fold in architecture review findings and future considerations\n\
        \    - Note any items that couldn't be verified\n  Output: Updated documents in ./docs/ArchOverview/\n\
        \  Cleanup: Remove .tmp/ directory\n```\n"
  ARCH-ADD-001:
    title: Additive investigation (specific area)
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults: {}
    exceptions: []
    rules:
      ARCH-ADD-001.R01:
        statement: 'Trigger: specific area AND ./docs/ArchOverview/ exists.'
      ARCH-ADD-001.R02:
        step: 1
        statement: Parallel CFA deep-dive + UX review with existing overview context; outputs .tmp/<area-slug>.md,
          .tmp/ux-<area-slug>.md.
      ARCH-ADD-001.R03:
        step: 2
        statement: 'Two documenters (write): create deep-dive; update overview (area section, cross-refs,
          HL diagram, UX notes).'
      ARCH-ADD-001.R04:
        step: 3
        statement: CFA verifies new/updated content only -> .tmp/verification-<area>.md.
      ARCH-ADD-001.R05:
        step: 4
        statement: Architecture-Reviewer critiques new/updated area -> .tmp/architecture-review.md.
      ARCH-ADD-001.R06:
        step: 5
        statement: Documenter applies corrections; remove .tmp/.
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 160-197
      text: "## Additive Investigation (Specific Area)\n\nTriggered when a specific area is requested\
        \ AND `./docs/ArchOverview/` already exists.\n\n```\nStep 1: Parallel investigation\n  Task A:\
        \ Code-Flow-Analyzer\n    Task: \"Deep-dive investigate <specific-area>\"\n    Input: Area path,\
        \ existing overview doc for context\n    Output: ./docs/ArchOverview/.tmp/<area-slug>.md\n\n \
        \ Task B: UX-Design-Reviewer\n    Task: \"Review UX for <specific-area>\"\n    Input: Area path,\
        \ relevant screens/specs, existing overview doc for context\n    Output: ./docs/ArchOverview/.tmp/ux-<area-slug>.md\n\
        \nStep 2: Investigation-Documenters (2 tasks, blocked by Step 1)\n  Permissions: write (both tasks)\n\
        \  Task A: Create new deep-dive document\n    Output: ./docs/ArchOverview/<project>-<area-slug>.md\n\
        \  Task B: Update overview document\n    - Add new area section\n    - Update cross-references\n\
        \    - Update high-level diagram if needed\n    - Add UX notes/layout maps if relevant\n\nStep\
        \ 3: Code-Flow-Analyzer (blocked by Step 2)\n  Task: Verify new/updated content only\n  Output:\
        \ ./docs/ArchOverview/.tmp/verification-<area>.md\n\nStep 4: Architecture-Reviewer (blocked by\
        \ Step 3)\n  Task: Critique the new/updated area and produce future considerations\n  Output:\
        \ ./docs/ArchOverview/.tmp/architecture-review.md\n\nStep 5: Investigation-Documenter (blocked\
        \ by Step 4)\n  Task: Apply corrections and fold in architecture review\n  Cleanup: Remove .tmp/\
        \ directory\n```\n"
  ARCH-DELTA-001:
    title: Delta refresh trigger and delta resolution (Step 1)
    kind: workflow
    scope:
      platforms:
      - claude
      - copilot
      actors:
      - dev-dude-architecture stage
    defaults:
      allowed_branches:
      - main
      - master
    exceptions: []
    rules:
      ARCH-DELTA-001.R01:
        statement: Trigger <all|vertical> refresh with ./docs/ArchOverview/ existing; all = repo-wide,
          else named vertical; missing dir -> explain nothing to refresh, run Base (all) or Additive (vertical).
      ARCH-DELTA-001.R02:
        statement: Require clean worktree on main or master; no branch switch; target = git rev-parse
          HEAD.
      ARCH-DELTA-001.R03:
        statement: Select in-scope docs; use **Source Commit** if commit and ancestor of target else oldest
          adding commit (git log --diff-filter=A --follow --format=%H -- <doc> | tail -1).
      ARCH-DELTA-001.R04:
        statement: Deepen shallow history; if no trustworthy baseline warn and ask before Base fallback.
      ARCH-DELTA-001.R05:
        statement: git diff --name-status <baseline>..<target> per document; earliest baseline for repo-wide
          new-area check.
      ARCH-DELTA-001.R06:
        statement: For all, repeat Phase 0 at target, compare boundaries, new boundary = candidate vertical;
          undocumented named vertical treated as new.
      ARCH-DELTA-001.R07:
        statement: Map changes to affected docs; produce affected docs + changes, candidate verticals
          + evidence, doc-neutral files + reasons.
      ARCH-DELTA-001.R08:
        statement: No affected docs and no new verticals -> report current, stop without rewriting.
    resolutions:
      CNF-ASK-002: 'Orchestrated: write permission plus an Expected output path in the envelope is the
        user-authorized approval for exactly those paths, including in-place delta updates; other paths
        need a blocked gate. Delta refresh "ask before Base fallback" becomes a blocked handoff gate.
        Standalone keeps "May I create this file at [path]?".'
    source_nuance:
    - path: skills/dev-dude-architecture/references/workflow.md
      lines: 199-233
      text: "## Delta Refresh (`<scope> refresh`)\n\nTriggered when the request matches `<all|vertical>\
        \ refresh` and `./docs/ArchOverview/` exists. `all`\nis a repository-wide scope; any other value\
        \ names one architecture vertical. If the directory does\nnot exist, explain that there is nothing\
        \ to refresh and run the Base Investigation for `all`, or an\nAdditive Investigation for the named\
        \ vertical.\n\n### Step 1: Resolve the Delta\n\n1. Require a clean worktree checked out on `main`\
        \ or `master`; do not switch branches or include\n   uncommitted changes. Set the target commit\
        \ to `git rev-parse HEAD`.\n2. Select the current architecture documents in scope: every document\
        \ for `all`, or the named\n   vertical's deep-dive plus the overview for a vertical refresh. Read\
        \ each selected document's\n   `**Source Commit**` value. Use it only when it\n   is a commit\
        \ and an ancestor of the target. If it is absent, invalid, or from divergent history,\n   use\
        \ the oldest commit that added the file\n   (`git log --diff-filter=A --follow --format=%H --\
        \ <document> | tail -1`).\n3. If history is shallow, deepen it before resolving creation commits.\
        \ If a trustworthy baseline\n   still cannot be resolved, warn that a safe delta is unavailable\
        \ and ask before falling back to a\n   Base Investigation.\n4. Use `git diff --name-status <document-baseline>..<target>`\
        \ to collect additions, modifications,\n   renames, and deletions relevant to each document. Use\
        \ the earliest resolved baseline for the\n   repository-wide new-area check.\n5. For `all`, repeat\
        \ Phase 0 discovery at the target commit. Compare discovered module, package,\n   service, and\
        \ domain boundaries with the areas covered by the overview and deep-dives. Treat a new\n   boundary\
        \ as a candidate vertical even when its files are not under an existing area's path. For a\n \
        \  named vertical not yet documented, discover that vertical's boundaries and treat it as new.\n\
        6. Map changed files to affected documented areas within the requested scope using paths, symbols,\n\
        \   dependencies, entry points, and cross-area flows. Produce:\n   - affected existing documents\
        \ and the changes that affect each one;\n   - candidate new verticals and supporting paths/entry\
        \ points;\n   - changed files that are documentation-neutral, with the reason they need no refresh.\n\
        \nIf there are no affected in-scope documents and no in-scope new verticals, report that the requested\n\
        architecture documentation is current and stop without rewriting files.\n"
  ARCH-DELTA-002:
